<!--
  Label scanner: point the camera at an item's label, or take or choose a photo of it, fit its ID in the frame,
  and the item opens.

  Live, where the page may use the camera (the static site sets window.SCANNER_LIVE; Apps Script serves the page in
  a frame that may not): the camera's picture fills the screen under the frame, and a couple of times a second the
  part in the frame is read; the same ID twice running opens it (three times, if it was only a near match), and a
  label's QR code opens it at once. "Take a photo" is there as well, and is all there is if the camera won't start.

  Otherwise Scan opens the photo picker at once: on a phone, its camera or photo library; on a computer, a file
  picker. The photo then fills the screen under a frame, the rest darkened: drag it to move it, pinch (or scroll) to zoom,
  until the ID is in the frame; then Read ID. The part in the frame is turned grey with strong contrast and read
  by Tesseract.js (loaded from the jsDelivr CDN while the photo is being taken, then cached by the browser),
  allowing only capitals and digits, twice, as a block and as a line. Each word read is matched against the real
  item IDs, forgiving the usual OCR mix-ups (O/0, I/1, S/5…): an exact ID opens the item, a near one only if both
  readings agree on it. Where the browser can read QR codes (BarcodeDetector), a label's QR code anywhere in the
  photo opens it at once.

  Exposes window.Scanner: Scanner.open({ ids, onFound }) with the item IDs to look for, from a tap or click (the
  photo picker needs one); onFound(id) gets the ID. Scanner.match(text, ids) is the matching on its own, for trying
  it out.
-->
<style>
  .scanner { position: fixed; inset: 0; z-index: 70; background: #000; color: #fff; overflow: hidden;
             opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s .25s; }
  .scanner.show { opacity: 1; visibility: visible; transition: opacity .25s ease, visibility 0s; }
  .scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .scanner.live video { display: block; }
  .scan-line { position: absolute; left: 6%; right: 6%; top: 50%; height: 1px; background: rgba(255, 255, 255, .5); display: none;
               animation: scanline 1.6s ease-in-out infinite alternate; }
  .scanner.live:not(.found) .scan-line { display: block; }
  @keyframes scanline { from { transform: translateY(calc(var(--h, 40px) * -.4)); } to { transform: translateY(calc(var(--h, 40px) * .4)); } }
  /* the photo, moved and zoomed by a transform from its top left corner */
  .scan-stage { position: absolute; inset: 0; touch-action: none; cursor: grab; }
  .scan-stage:active { cursor: grabbing; }
  .scan-stage img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; user-select: none; pointer-events: none; }
  /* the frame: everything outside it darkened by its shadow, and a corner mark at each corner */
  .scan-frame { position: absolute; left: 50%; top: 42%; width: min(84vw, 460px); aspect-ratio: 3 / 1; transform: translate(-50%, -50%);
                box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .6); border-radius: 4px; pointer-events: none; }
  .scan-frame i { position: absolute; width: 22px; height: 22px; border: 0 solid #fff; transition: border-color .2s ease; }
  .scan-frame i:nth-child(1) { left: -2px; top: -2px; border-width: 3px 0 0 3px; }
  .scan-frame i:nth-child(2) { right: -2px; top: -2px; border-width: 3px 3px 0 0; }
  .scan-frame i:nth-child(3) { left: -2px; bottom: -2px; border-width: 0 0 3px 3px; }
  .scan-frame i:nth-child(4) { right: -2px; bottom: -2px; border-width: 0 3px 3px 0; }
  .scanner.found .scan-frame i { border-color: var(--ok); }
  .scanner:not(.has-photo):not(.live) .scan-frame { display: none; }
  .scan-hint, .scan-status { position: absolute; left: 24px; right: 24px; margin: 0; text-align: center; pointer-events: none; }
  .scan-hint { top: calc(42% - min(14vw, 77px) - 64px); font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .scanner:not(.has-photo):not(.live) .scan-hint { top: 40%; }
  .scan-status { top: calc(42% + min(14vw, 77px) + 24px); font: 400 .9rem/1.5 var(--body); color: rgba(255, 255, 255, .85); min-height: 1.5em; }
  .scanner.found .scan-status { color: var(--ok); font: 500 1.05rem var(--mono); letter-spacing: .08em; }
  .scan-close { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
                width: 44px; height: 44px; border: 0; background: none; color: #fff; font-size: 1.8rem; line-height: 1; }
  .scan-actions { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); display: flex; justify-content: center; gap: 12px; }
  .scan-btn { display: inline-flex; align-items: center; justify-content: center; gap: 14px; min-height: 48px; padding: 0 22px; border: 1px solid #fff;
              color: #fff; background: none; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .scan-btn.fill { background: #fff; color: #111; }
  .scan-btn:disabled { opacity: .5; cursor: wait; }
  .scan-btn input { display: none; }
  .scanner:not(.has-photo) #scanGo { display: none; }
</style>

<div class="scanner" id="scanner" role="dialog" aria-label="Scan a label" hidden>
  <video id="scanVideo" playsinline muted autoplay></video>
  <div class="scan-stage" id="scanStage"><img id="scanImage" alt="The photo of the label"></div>
  <div class="scan-frame" id="scanFrame"><i></i><i></i><i></i><i></i><div class="scan-line"></div></div>
  <p class="scan-hint" id="scanHint"></p>
  <p class="scan-status" id="scanStatus" aria-live="polite"></p>
  <button class="scan-close" type="button" id="scanClose" aria-label="Close">×</button>
  <div class="scan-actions">
    <label class="scan-btn" id="scanPick"><span id="scanPickText">Take a photo</span><input type="file" accept="image/*" id="scanFile"></label>
    <button class="scan-btn fill" type="button" id="scanGo">Read ID <span aria-hidden="true">→</span></button>
  </div>
</div>

<script>
window.Scanner = (() => {
  const TESSERACT = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  // Characters OCR mistakes for one another; swapping within a set costs a fraction of a different character.
  const LOOKALIKE = ['O0DQ', 'I1L', 'S5', 'B8', 'Z2', 'G6'];
  const MAX_ZOOM = 8; // times the size at which the photo just covers the frame
  const el = (id) => document.getElementById(id);
  const root = el('scanner'), stage = el('scanStage'), image = el('scanImage'), frame = el('scanFrame'), file = el('scanFile'), video = el('scanVideo');
  // photo: the photo being fitted, as { src, width, height }; stream: the live camera, while it runs
  let opts = null, reader = null, photo = null, url = null, view = { s: 1, x: 0, y: 0 }, canvas = document.createElement('canvas');
  let stream = null, timer = 0, last = '', streak = 0;

  const status = (hint, line) => {
    if (hint != null) el('scanHint').textContent = hint;
    if (line != null) el('scanStatus').textContent = line;
  };

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = Object.assign(document.createElement('script'), { src, onload: resolve, onerror: () => reject(new Error('Could not load ' + src)) });
      document.head.appendChild(s);
    });
  }

  /** The text reader, made once: English, capitals and digits only. */
  function getReader() {
    reader = reader || loadScript(TESSERACT).then(async () => {
      const worker = await Tesseract.createWorker('eng', 1);
      await worker.setParameters({ tessedit_char_whitelist: CHARS });
      return worker;
    });
    reader.catch(() => { reader = null; }); // try again next time
    return reader;
  }

  // ---- matching ---------------------------------------------------------------------

  function cost(a, b) {
    if (a === b) return 0;
    return LOOKALIKE.some((set) => set.includes(a) && set.includes(b)) ? 0.3 : 1;
  }

  /** Edit distance between two words, with look-alike swaps cheap. */
  function distance(a, b) {
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const row = [i];
      for (let j = 1; j <= b.length; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + cost(a[i - 1], b[j - 1]));
      prev = row;
    }
    return prev[b.length];
  }

  /**
   * The item ID the text names, as { id, exact }: a word that is an ID (exact), or else one close enough to exactly
   * one ID (only look-alike swaps, for short IDs). Neighbouring words joined come first, since the reader sometimes
   * splits one: "MD1 0" is MD10, not MD1. Null if none.
   */
  function match(text) {
    const parts = String(text).toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
    const words = [...parts.slice(1).map((w, i) => parts[i] + w), ...parts].filter((w) => w.length >= 2);
    const ids = opts.ids;
    for (const w of words) if (ids.includes(w)) return { id: w, exact: true };
    let best = null, bestD = Infinity, second = Infinity;
    for (const w of words) {
      for (const id of ids) {
        if (Math.abs(id.length - w.length) > 1) continue;
        const d = distance(w, id);
        if (d < bestD) { second = bestD; bestD = d; best = id; } else if (d < second && id !== best) second = d;
      }
    }
    const allowed = best && best.length <= 3 ? 0.6 : 1;
    return best && bestD <= allowed && second - bestD >= 0.5 ? { id: best, exact: false } : null;
  }

  // ---- reading -----------------------------------------------------------------------

  /**
   * Draw part of an image (sx, sy, sw, sh in its px) for the reader: grey, with the contrast doubled, so a label's
   * paper goes white and its print black even in poor light, on a white margin. Scaled so it is `height` px tall
   * (about 80 suits a line of text filling the frame), or else to at most 1400px across.
   */
  function prepare(img, sx, sy, sw, sh, height) {
    const scale = height ? height / sh : Math.min(1.5, 1400 / sw, 1400 / sh), w = Math.round(sw * scale), h = Math.round(sh * scale);
    const pad = Math.round(Math.min(h, 200) * 0.3);
    Object.assign(canvas, { width: w + pad * 2, height: h + pad * 2 });
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, sx, sy, sw, sh, pad, pad, w, h);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height), px = data.data;
    for (let i = 0; i < px.length; i += 4) {
      const grey = (px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000;
      px[i] = px[i + 1] = px[i + 2] = (grey - 128) * 2 + 128; // the array clamps it to 0–255
    }
    ctx.putImageData(data, 0, 0);
    return canvas;
  }

  /** Read an image with the reader in one of its page layouts: '6' a block of text, '7' a single line. */
  async function read(image, layout) {
    const worker = await getReader();
    if (worker.layout !== layout) { await worker.setParameters({ tessedit_pageseg_mode: layout }); worker.layout = layout; }
    return (await worker.recognize(image)).data.text;
  }


  // ---- the photo, moved and zoomed under the frame -------------------------------------

  /** The frame, relative to the scanner (which fills the screen). */
  function frameBox() {
    const r = root.getBoundingClientRect(), f = frame.getBoundingClientRect();
    return { left: f.left - r.left, top: f.top - r.top, width: f.width, height: f.height };
  }

  /** The zoom at which the photo just covers the frame: the least it may be. */
  const minZoom = (f) => Math.max(f.width / photo.width, f.height / photo.height);

  /** Show the photo at view, first keeping it within its zoom range and covering the frame. */
  function place() {
    const f = frameBox(), lo = minZoom(f);
    view.s = Math.min(lo * MAX_ZOOM, Math.max(lo, view.s));
    view.x = Math.min(f.left, Math.max(f.left + f.width - photo.width * view.s, view.x));
    view.y = Math.min(f.top, Math.max(f.top + f.height - photo.height * view.s, view.y));
    image.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  }

  /** Zoom by k (within the zoom range) about a point (px, relative to the scanner), which stays where it is. */
  function zoomAbout(k, px, py) {
    const lo = minZoom(frameBox()), s = Math.min(lo * MAX_ZOOM, Math.max(lo, view.s * k)), real = s / view.s;
    view.x = px - (px - view.x) * real;
    view.y = py - (py - view.y) * real;
    view.s = s;
    place();
  }

  /**
   * A new photo: the whole of it in view if it fits, else as large as covers the frame, centred on the frame.
   * It is read from the very <img> that shows it, not from createImageBitmap: Safari's bitmap of a phone photo can
   * ignore the photo's EXIF rotation while the <img> (and drawing it on a canvas) honours it, so the part read was
   * not the part in the frame.
   */
  async function usePhoto(f) {
    stopCamera();
    status('Opening the photo…', '');
    if (url) URL.revokeObjectURL(url);
    image.src = url = URL.createObjectURL(f);
    try { await image.decode(); } catch (e) { status('That file isn’t a photo this browser can open', ''); return; }
    if (!opts) return;
    photo = { src: image, width: image.naturalWidth, height: image.naturalHeight };
    image.style.width = photo.width + 'px';
    image.style.height = photo.height + 'px';
    root.classList.add('has-photo');
    el('scanPickText').textContent = 'Choose another';
    const r = root.getBoundingClientRect(), fb = frameBox();
    view.s = Math.max(minZoom(fb), Math.min(r.width / photo.width, r.height / photo.height));
    view.x = fb.left + fb.width / 2 - photo.width * view.s / 2;
    view.y = fb.top + fb.height / 2 - photo.height * view.s / 2;
    place();
    status('Drag and pinch to fit the ID in the frame', '');
    const code = await qrIn(photo.src);
    if (code) done(code);
  }

  // Dragging with one finger (or the mouse) moves the photo; with two, pinching zooms it; the wheel zooms too.
  const pointers = new Map();
  let grip = null; // the view and the pointers as they were when the last one went down or up
  const regrip = () => {
    const pts = [...pointers.values()], mid = pts.length > 1 ? { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 } : pts[0];
    grip = pts.length ? { ...view, mid, dist: pts.length > 1 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0 } : null;
  };
  const local = (e) => { const r = root.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  stage.addEventListener('pointerdown', (e) => {
    if (!photo) return;
    pointers.set(e.pointerId, local(e));
    regrip();
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* it still gets the moves while over the photo */ }
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, local(e));
    const pts = [...pointers.values()];
    if (pts.length === 1) {
      view.x = grip.x + pts[0].x - grip.mid.x;
      view.y = grip.y + pts[0].y - grip.mid.y;
      place();
    } else {
      const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 }, dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      Object.assign(view, { s: grip.s, x: grip.x + mid.x - grip.mid.x, y: grip.y + mid.y - grip.mid.y });
      zoomAbout(dist / grip.dist, mid.x, mid.y);
    }
  });
  const lift = (e) => { pointers.delete(e.pointerId); regrip(); };
  stage.addEventListener('pointerup', lift);
  stage.addEventListener('pointercancel', lift);
  stage.addEventListener('wheel', (e) => {
    if (!photo) return;
    e.preventDefault();
    const p = local(e);
    zoomAbout(Math.exp(-e.deltaY / 400), p.x, p.y);
  }, { passive: false });
  addEventListener('resize', () => { if (photo && opts) place(); });

  // ---- reading -------------------------------------------------------------------------

  /** A label's QR code anywhere in the photo, where the browser can read QR codes: the item ID in its link. */
  async function qrIn(img) {
    if (!('BarcodeDetector' in window)) return null;
    try {
      if (!(await BarcodeDetector.getSupportedFormats()).includes('qr_code')) return null;
      for (const c of await new BarcodeDetector({ formats: ['qr_code'] }).detect(img)) {
        const m = /[?&]item=([^&#]+)/.exec(c.rawValue), id = m && decodeURIComponent(m[1]).toUpperCase();
        if (id && opts && opts.ids.includes(id)) return id;
      }
    } catch (e) { /* no QR code, then */ }
    return null;
  }

  /** Read the part of the photo in the frame, as a block and as a line: an exact ID, or a near one both agree on. */
  async function readFrame() {
    if (!photo) return;
    const go = el('scanGo'), f = frameBox();
    const box = [(f.left - view.x) / view.s, (f.top - view.y) / view.s, f.width / view.s, f.height / view.s];
    go.disabled = true;
    status(null, reader ? 'Reading…' : 'Loading the text reader…');
    try {
      const block = match(await read(prepare(photo.src, ...box, 80), '6'));
      const line = block && block.exact ? null : match(await read(prepare(photo.src, ...box, 110), '7'));
      const found = [block, line].find((m) => m && m.exact) || (block && line && block.id === line.id ? block : null);
      if (found) return done(found.id);
      status(null, block || line ? `Not sure (${(block || line).id}?): fit the ID more closely and try again` : 'No item ID in the frame: fit it more closely and try again');
    } catch (e) {
      status(null, 'Could not read it: check the connection and try again');
    } finally { go.disabled = false; }
  }

  function done(id) {
    if (!opts) return;
    root.classList.add('found');
    status('Found', id);
    if (navigator.vibrate) navigator.vibrate(40);
    const found = opts.onFound;
    stopCamera();
    setTimeout(() => { close(); found(id); }, 450);
  }

  // ---- the live camera -----------------------------------------------------------------

  /** Whether to try the camera live: the page says it may (window.SCANNER_LIVE), over https, in a browser that can. */
  const liveAllowed = () => !!window.SCANNER_LIVE && window.isSecureContext && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  /** The part of the camera's picture under the frame, in video px (the picture is cropped to cover the screen). */
  function frameInVideo() {
    const vw = video.videoWidth, vh = video.videoHeight, r = root.getBoundingClientRect(), f = frame.getBoundingClientRect();
    const k = Math.max(r.width / vw, r.height / vh), ox = (r.width - vw * k) / 2, oy = (r.height - vh * k) / 2;
    return [(f.left - r.left - ox) / k, (f.top - r.top - oy) / k, f.width / k, f.height / k];
  }

  /** One look: the QR code if the browser can read it, then the text in the frame. */
  async function look() {
    if (!stream || video.readyState < 2 || !video.videoWidth) return;
    const code = await qrIn(video);
    if (code) return done(code);
    await getReader();
    if (!stream) return;
    const text = await read(prepare(video, ...frameInVideo(), 80), '6'), m = match(text), id = m && m.id;
    if (!stream) return;
    status(null, id ? id + '?' : text.trim().split(/\s+/).slice(0, 3).join(' '));
    streak = id && id === last ? streak + 1 : 1; // the same ID twice running opens it, or three times if it was only a near match
    last = id || '';
    if (id && streak >= (m.exact ? 2 : 3)) done(id);
  }

  async function loop() {
    if (!opts || !stream) return;
    try { await look(); } catch (e) { status(null, 'Could not read the label'); }
    if (opts && stream) timer = setTimeout(loop, 150);
  }

  async function startCamera() {
    status('Starting the camera…', '');
    const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    if (!opts || photo) { s.getTracks().forEach((t) => t.stop()); return; } // closed, or a photo chosen, meanwhile
    stream = s;
    video.srcObject = stream;
    await video.play();
    root.classList.add('live');
    frame.style.setProperty('--h', frame.offsetHeight + 'px');
    status(reader ? 'Fit the ID on the label in the frame' : 'Loading the text reader…', '');
    getReader().then(() => { if (stream) status('Fit the ID on the label in the frame'); },
                     () => { if (stream) status('Could not load the text reader', 'Check the connection and try again'); });
    loop();
  }

  function stopCamera() {
    clearTimeout(timer);
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    video.srcObject = null;
    root.classList.remove('live');
  }

  // ---- open and close ----------------------------------------------------------------

  /** Open the scanner and, at once, the photo picker (this must run in the tap or click that asked for it). */
  function open(options) {
    opts = { ...options, ids: options.ids.map((id) => String(id).toUpperCase()) };
    photo = null;
    last = '';
    streak = 0;
    root.hidden = false;
    root.classList.remove('found', 'has-photo', 'live');
    el('scanPickText').textContent = 'Take a photo';
    status('Take or choose a photo of the label', 'Then fit its ID in the frame');
    requestAnimationFrame(() => root.classList.add('show'));
    getReader().catch(() => {}); // load the reader while the camera starts or the photo is taken
    if (!liveAllowed()) { file.click(); return; }
    startCamera().catch(() => {
      stopCamera();
      if (opts && !photo) status('The camera isn’t available', 'Take a photo of the label instead');
    });
  }

  function close() {
    stopCamera();
    opts = null;
    photo = null;
    pointers.clear();
    root.classList.remove('show');
    setTimeout(() => {
      if (opts) return;
      root.hidden = true;
      image.removeAttribute('src');
      if (url) { URL.revokeObjectURL(url); url = null; }
    }, 260);
  }

  file.addEventListener('change', () => {
    const f = file.files && file.files[0];
    file.value = '';
    if (f && opts) usePhoto(f);
  });
  file.addEventListener('cancel', () => { if (opts && !photo && !stream) close(); }); // backed out of the picker: nothing to scan
  document.addEventListener('visibilitychange', () => { if (document.hidden && stream) close(); }); // the camera stops with the page
  el('scanGo').addEventListener('click', readFrame);
  el('scanClose').addEventListener('click', close);
  document.addEventListener('keydown', (e) => {
    if (!opts || (e.key !== 'Escape' && e.key !== 'Enter')) return;
    e.stopImmediatePropagation(); // the page behind doesn't get them while the scanner is open
    e.preventDefault();
    if (e.key === 'Escape') close(); else if (photo) readFrame();
  }, true);

  return { open, close, match: (text, ids) => { const keep = opts; opts = { ids }; try { const m = match(text); return m && m.id; } finally { opts = keep; } } };
})();
</script>
