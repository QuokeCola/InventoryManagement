<!--
  Label scanner: point the phone's camera at an item's label, fit its ID in the frame, and the item opens.

  The camera's picture fills the screen, darkened outside a frame in the middle. A couple of times a second the
  part inside the frame is turned grey with strong contrast and read by Tesseract.js (loaded from the jsDelivr
  CDN the first time, then cached by the browser), allowing only capitals and digits. Each word read is matched
  against the real item IDs, forgiving the usual OCR mix-ups (O/0, I/1, S/5…); the same ID twice running opens
  it (three times, if it was only a near match). Where the browser can read QR codes (BarcodeDetector), the
  label's QR code opens it at once.

  If the page may not use the camera itself, "Take a photo" opens the phone's camera app instead and the photo is
  read: its middle first, where the label will be, then the whole of it. That is the usual case once deployed:
  Apps Script serves the page in a sandboxed frame that may not use the camera. Once the camera has been refused,
  the scanner remembers it, and from then on Scan goes straight to the camera app.

  Exposes window.Scanner: Scanner.open({ ids, onFound }) with the item IDs to look for; onFound(id) gets the ID.
  Scanner.match(text, ids) is the matching on its own, for trying it out.
-->
<style>
  .scanner { position: fixed; inset: 0; z-index: 70; background: #000; color: #fff; overflow: hidden;
             opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s .25s; }
  .scanner.show { opacity: 1; visibility: visible; transition: opacity .25s ease, visibility 0s; }
  .scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* the frame: everything outside it darkened by its shadow, and a corner mark at each corner */
  .scan-frame { position: absolute; left: 50%; top: 42%; width: min(78vw, 420px); aspect-ratio: 3 / 1; transform: translate(-50%, -50%);
                box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .58); border-radius: 4px; transition: box-shadow .3s ease; }
  .scan-frame i { position: absolute; width: 22px; height: 22px; border: 0 solid #fff; transition: border-color .2s ease; }
  .scan-frame i:nth-child(1) { left: -2px; top: -2px; border-width: 3px 0 0 3px; }
  .scan-frame i:nth-child(2) { right: -2px; top: -2px; border-width: 3px 3px 0 0; }
  .scan-frame i:nth-child(3) { left: -2px; bottom: -2px; border-width: 0 0 3px 3px; }
  .scan-frame i:nth-child(4) { right: -2px; bottom: -2px; border-width: 0 3px 3px 0; }
  .scanner.found .scan-frame i { border-color: var(--ok); }
  .scan-line { position: absolute; left: 6%; right: 6%; top: 50%; height: 1px; background: rgba(255, 255, 255, .5); animation: scanline 1.6s ease-in-out infinite alternate; }
  @keyframes scanline { from { transform: translateY(calc(var(--h, 40px) * -.4)); } to { transform: translateY(calc(var(--h, 40px) * .4)); } }
  .scanner.idle .scan-line, .scanner.found .scan-line { display: none; }
  .scan-hint, .scan-read { position: absolute; left: 24px; right: 24px; margin: 0; text-align: center; }
  .scan-hint { top: calc(42% - min(13vw, 70px) - 64px); font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .scan-read { top: calc(42% + min(13vw, 70px) + 26px); font: 500 1rem var(--mono); letter-spacing: .08em; color: rgba(255, 255, 255, .8); min-height: 1.5em; }
  .scanner.found .scan-read { color: var(--ok); }
  .scan-close { position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; border: 0; background: none; color: #fff; font-size: 1.8rem; line-height: 1; }
  .scan-photo { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); transform: translateX(-50%);
                display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border: 1px solid #fff; color: #fff; background: none;
                font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .scan-photo input { display: none; }
</style>

<div class="scanner" id="scanner" role="dialog" aria-label="Scan a label" hidden>
  <video id="scanVideo" playsinline muted></video>
  <div class="scan-frame" id="scanFrame"><i></i><i></i><i></i><i></i><div class="scan-line"></div></div>
  <p class="scan-hint" id="scanHint">Fit the ID on the label in the frame</p>
  <p class="scan-read" id="scanRead" aria-live="polite"></p>
  <button class="scan-close" type="button" id="scanClose" aria-label="Close">×</button>
  <label class="scan-photo" id="scanPhoto" hidden>Take a photo<input type="file" accept="image/*" capture="environment" id="scanFile"></label>
</div>

<script>
window.Scanner = (() => {
  const TESSERACT = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  // Characters OCR mistakes for one another; swapping within a set costs a fraction of a different character.
  const LOOKALIKE = ['O0DQ', 'I1L', 'S5', 'B8', 'Z2', 'G6'];
  const el = (id) => document.getElementById(id);
  const root = el('scanner'), video = el('scanVideo'), frame = el('scanFrame');
  let opts = null, stream = null, timer = 0, reader = null, detector = null, last = '', streak = 0, canvas = document.createElement('canvas');

  const status = (hint, read) => {
    if (hint != null) el('scanHint').textContent = hint;
    if (read != null) el('scanRead').textContent = read;
  };

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = Object.assign(document.createElement('script'), { src, onload: resolve, onerror: () => reject(new Error('Could not load ' + src)) });
      document.head.appendChild(s);
    });
  }

  /** The text reader, made once: English, capitals and digits only. */
  function getReader() {
    reader = reader || loadScript(TESSERACT).then(async () => {
      const worker = await Tesseract.createWorker('eng', 1);
      await worker.setParameters({ tessedit_char_whitelist: CHARS });
      return worker;
    });
    reader.catch(() => { reader = null; }); // try again next time
    return reader;
  }

  // ---- matching ---------------------------------------------------------------------

  function cost(a, b) {
    if (a === b) return 0;
    return LOOKALIKE.some((set) => set.includes(a) && set.includes(b)) ? 0.3 : 1;
  }

  /** Edit distance between two words, with look-alike swaps cheap. */
  function distance(a, b) {
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const row = [i];
      for (let j = 1; j <= b.length; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + cost(a[i - 1], b[j - 1]));
      prev = row;
    }
    return prev[b.length];
  }

  /**
   * The item ID the text names, as { id, exact }: a word that is an ID (exact), or else one close enough to exactly
   * one ID (only look-alike swaps, for short IDs). Neighbouring words joined come first, since the reader sometimes
   * splits one: "MD1 0" is MD10, not MD1. Null if none.
   */
  function match(text) {
    const parts = String(text).toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
    const words = [...parts.slice(1).map((w, i) => parts[i] + w), ...parts].filter((w) => w.length >= 2);
    const ids = opts.ids;
    for (const w of words) if (ids.includes(w)) return { id: w, exact: true };
    let best = null, bestD = Infinity, second = Infinity;
    for (const w of words) {
      for (const id of ids) {
        if (Math.abs(id.length - w.length) > 1) continue;
        const d = distance(w, id);
        if (d < bestD) { second = bestD; bestD = d; best = id; } else if (d < second && id !== best) second = d;
      }
    }
    const allowed = best && best.length <= 3 ? 0.6 : 1;
    return best && bestD <= allowed && second - bestD >= 0.5 ? { id: best, exact: false } : null;
  }

  // ---- reading -----------------------------------------------------------------------

  /**
   * Draw part of an image (sx, sy, sw, sh in its px) for the reader: grey, with the contrast doubled, so a label's
   * paper goes white and its print black even in poor light, on a white margin. Scaled so it is `height` px tall
   * (about 80 suits a line of text filling the frame), or for a whole photo to at most 1400px.
   */
  function prepare(img, sx, sy, sw, sh, height) {
    const scale = height ? height / sh : Math.min(1.5, 1400 / sw, 1400 / sh), w = Math.round(sw * scale), h = Math.round(sh * scale);
    const pad = Math.round(Math.min(h, 200) * 0.3);
    Object.assign(canvas, { width: w + pad * 2, height: h + pad * 2 });
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, sx, sy, sw, sh, pad, pad, w, h);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height), px = data.data;
    for (let i = 0; i < px.length; i += 4) {
      const grey = (px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000;
      px[i] = px[i + 1] = px[i + 2] = (grey - 128) * 2 + 128; // the array clamps it to 0–255
    }
    ctx.putImageData(data, 0, 0);
    return canvas;
  }

  /** Read an image: the text in the frame as a block (layout '6'), or a whole photo as words scattered anywhere ('11'). */
  async function read(image, layout) {
    const worker = await getReader();
    if (worker.layout !== layout) { await worker.setParameters({ tessedit_pageseg_mode: layout }); worker.layout = layout; }
    return (await worker.recognize(image)).data.text;
  }

  /** The part of the camera's picture under the frame, in video px (the picture is cropped to cover the screen). */
  function frameInVideo() {
    const vw = video.videoWidth, vh = video.videoHeight, r = root.getBoundingClientRect(), f = frame.getBoundingClientRect();
    const k = Math.max(r.width / vw, r.height / vh), ox = (r.width - vw * k) / 2, oy = (r.height - vh * k) / 2;
    return [(f.left - r.left - ox) / k, (f.top - r.top - oy) / k, f.width / k, f.height / k];
  }

  /** One look: the QR code if the browser can read it, then the text in the frame. */
  async function look() {
    if (!stream || video.readyState < 2) return;
    if (detector) {
      const codes = await detector.detect(video).catch(() => []);
      for (const c of codes) {
        const m = /[?&]item=([^&#]+)/.exec(c.rawValue), id = m && decodeURIComponent(m[1]).toUpperCase();
        if (id && opts.ids.includes(id)) return done(id);
      }
    }
    await getReader();
    if (!stream) return;
    const text = await read(prepare(video, ...frameInVideo(), 80), '6'), m = match(text), id = m && m.id;
    status(null, id ? id + '?' : text.trim().split(/\s+/).slice(0, 3).join(' '));
    // The same ID read twice running opens it, or three times if it was only a near match.
    streak = id && id === last ? streak + 1 : 1;
    last = id || '';
    if (id && streak >= (m.exact ? 2 : 3)) return done(id);
  }

  async function loop() {
    if (!opts || !stream) return;
    try { await look(); } catch (e) { status('Could not read the label', ''); }
    if (opts && stream) timer = setTimeout(loop, 120);
  }

  function done(id) {
    root.classList.add('found');
    status('Found', id);
    if (navigator.vibrate) navigator.vibrate(40);
    const found = opts.onFound;
    stopCamera();
    setTimeout(() => { close(); found(id); }, 450);
  }

  // ---- camera ------------------------------------------------------------------------

  const cameraAllowed = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) &&
                              !(document.featurePolicy && !document.featurePolicy.allowsFeature('camera'));

  async function startCamera() {
    status('Starting the camera…', '');
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } })
      .catch((err) => { err.refused = err.name === 'NotAllowedError'; throw err; }); // as against the video then failing to play
    video.srcObject = stream;
    remember(false);
    await video.play();
    if ('BarcodeDetector' in window) detector = await BarcodeDetector.getSupportedFormats().then((f) => f.includes('qr_code') ? new BarcodeDetector({ formats: ['qr_code'] }) : null, () => null);
    status(reader ? 'Fit the ID on the label in the frame' : 'Loading the text reader…', '');
    getReader().then(() => { if (stream) status('Fit the ID on the label in the frame'); }, () => status('Could not load the text reader', 'Check the connection and try again'));
    root.classList.remove('idle');
    loop();
  }

  function stopCamera() {
    clearTimeout(timer);
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    video.srcObject = null;
  }

  // Whether the live camera was refused before (kept in this browser), so Scan can go straight to the camera app.
  const REFUSED = 'labScanner.cameraRefused';
  const refusedBefore = () => { try { return localStorage.getItem(REFUSED) === '1'; } catch (e) { return false; } };
  const remember = (refused) => { try { if (refused) localStorage.setItem(REFUSED, '1'); else localStorage.removeItem(REFUSED); } catch (e) {} };

  /** No live camera: offer the phone's camera app, and read the photo it takes. */
  function usePhoto(reason) {
    root.classList.add('idle');
    el('scanPhoto').hidden = false;
    status(reason || 'Take a close photo of the label’s ID', '');
    getReader().catch(() => {});
  }

  el('scanFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !opts) return;
    status('Reading…', '');
    try {
      // One photo, one chance: read its middle band, then all of it as a block and as scattered words. An exact ID
      // goes as soon as one is read; a near one only if two readings agree on it.
      const img = await createImageBitmap(file), W = img.width, H = img.height, readings = [];
      const tries = [() => read(prepare(img, W * 0.1, H * 0.3, W * 0.8, H * 0.4), '6'),
                     () => read(prepare(img, 0, 0, W, H), '6'), () => read(prepare(img, 0, 0, W, H), '11')];
      let found = null;
      for (const attempt of tries) {
        const m = match(await attempt());
        if (m && m.exact) { found = m; break; }
        if (m && readings.some((r) => r.id === m.id)) { found = m; break; }
        if (m) readings.push(m);
      }
      if (found) done(found.id);
      else status('No item ID found', readings.length ? 'Not sure: try again, closer to the label' : 'Try again, closer to the label');
    } catch (err) { status('Could not read the photo', ''); }
  });

  // ---- open and close ----------------------------------------------------------------

  function open(options) {
    opts = { ...options, ids: options.ids.map((id) => String(id).toUpperCase()) };
    last = '';
    streak = 0;
    root.hidden = false;
    root.classList.remove('found');
    root.classList.add('idle');
    el('scanPhoto').hidden = true;
    frame.style.setProperty('--h', frame.offsetHeight + 'px');
    requestAnimationFrame(() => root.classList.add('show'));
    if (!cameraAllowed() || refusedBefore()) { // straight to the camera app (while this is still the tap on Scan, which it needs)
      usePhoto();
      el('scanFile').click();
      return;
    }
    startCamera().catch((err) => {
      stopCamera();
      if (err && err.refused) remember(true);
      usePhoto(err && err.refused ? 'The camera can’t run inside this app: take a photo of the label instead' : 'No camera: take a photo instead');
    });
  }

  function close() {
    stopCamera();
    opts = null;
    root.classList.remove('show');
    setTimeout(() => { if (!opts) root.hidden = true; }, 260);
  }

  el('scanClose').addEventListener('click', close);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && opts) { e.stopImmediatePropagation(); close(); }
  }, true);
  document.addEventListener('visibilitychange', () => { if (document.hidden && stream) close(); });

  return { open, close, match: (text, ids) => { const keep = opts; opts = { ids }; try { const m = match(text); return m && m.id; } finally { opts = keep; } } };
})();
</script>
