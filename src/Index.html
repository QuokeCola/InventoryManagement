<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5f6b7a; --border: #dde2e8;
      --accent: #00274c; --ok: #1d7a45; --warn: #a15c00; --bad: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161c; --card: #1b2028; --text: #e6e9ee; --muted: #9aa5b3; --border: #2e3540;
        --accent: #ffcb05; --ok: #5ccf8a; --warn: #f0b04a; --bad: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.1rem; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .id { font-size: 1.6rem; font-weight: 700; letter-spacing: .02em; }
    .desc { font-size: 1.1rem; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; border: 1px solid currentColor; }
    .available { color: var(--ok); } .out { color: var(--warn); } .inactive { color: var(--bad); }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0 0; align-items: baseline; }
    dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
    textarea, input { width: 100%; font: inherit; padding: 10px; border-radius: 8px;
                      border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    button { width: 100%; font: inherit; font-weight: 600; padding: 14px; margin-top: 10px;
             border: 0; border-radius: 10px; background: var(--accent); color: var(--card); cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button:disabled { opacity: .5; cursor: wait; }
    .msg { padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid; }
    .msg.error { color: var(--bad); } .msg.ok { color: var(--ok); }
    .muted { color: var(--muted); font-size: .9rem; }
    ul { padding-left: 18px; margin: 6px 0 0; }
    a { color: var(--accent); }
    [hidden] { display: none !important; }

    /* ---- Motion ---------------------------------------------------------- */
    .card { position: relative; overflow: hidden; }
    .fade-in { animation: fade-in .25s ease-out both; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } }

    /* Placeholder while an item loads */
    .skeleton { display: grid; gap: 10px; }
    .skeleton i { display: block; height: 14px; border-radius: 6px; background: var(--border);
                  background-image: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
                  background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    .skeleton i.big { height: 28px; width: 40%; } .skeleton i.mid { width: 70%; } .skeleton i.short { width: 30%; height: 20px; border-radius: 999px; }
    @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }

    /* Progress line along the top of the card while the server works */
    .card.working::before { content: ""; position: absolute; top: 0; left: 0; height: 3px; width: 35%;
                            background: var(--accent); animation: progress 1.1s ease-in-out infinite; }
    @keyframes progress { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

    /* Spinner inside buttons and next to the condition dropdown */
    .spinner { display: inline-block; width: 1em; height: 1em; vertical-align: -.15em; margin-right: .5em;
               border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
               animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button { transition: transform .1s ease, opacity .2s ease; }
    button:active:not(:disabled) { transform: scale(.98); }

    /* The status is stamped on, like a library card, when it changes */
    .badge.stamp { animation: stamp .45s cubic-bezier(.2, 1.4, .4, 1) both; }
    @keyframes stamp {
      0% { opacity: 0; transform: scale(1.9) rotate(-10deg); }
      60% { opacity: 1; transform: scale(.94) rotate(-3deg); }
      100% { transform: scale(1) rotate(-3deg); }
    }
    .badge { transform-origin: center; }
    .badge.stamped { transform: rotate(-3deg); border-width: 2px; }

    .msg { animation: fade-in .25s ease-out both; }
    li.new { animation: flash 1.6s ease-out; border-radius: 4px; }
    @keyframes flash { from { background: color-mix(in srgb, var(--accent) 25%, transparent); } }

    /* Condition dropdown */
    select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
             border-radius: 8px; padding: 4px 8px; }
    .cond { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cond .state { font-size: .85rem; color: var(--muted); }
    .cond .state.saved { color: var(--ok); animation: fade-in .2s ease-out both; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
      .card.working::before { width: 100%; transform: none; opacity: .5; }
    }
  </style>
</head>
<body>
<main>
  <h1>Lab Inventory</h1>
  <div id="msg" hidden></div>

  <section id="loading" class="card skeleton" hidden aria-label="Loading item">
    <i class="big"></i><i class="mid"></i><i class="short"></i><i></i><i class="mid"></i>
  </section>

  <section id="item" class="card" hidden aria-live="polite">
    <div class="id" id="itemId"></div>
    <div class="desc" id="itemDesc"></div>
    <span id="status" class="badge"></span>
    <dl id="details"></dl>
    <div id="actions">
      <textarea id="note" rows="2" placeholder="Note (optional): where it's going, project, etc."></textarea>
      <button id="checkout" hidden>Check out to me</button>
      <button id="return" hidden>Return</button>
    </div>
  </section>

  <section id="historyCard" class="card" hidden>
    <strong>Recent activity</strong>
    <ul id="history"></ul>
  </section>

  <section class="card">
    <form id="lookup">
      <input id="lookupId" placeholder="Item ID, e.g. HA1" autocapitalize="characters" autocomplete="off">
      <button type="submit" class="secondary" id="lookupBtn">Look up item</button>
    </form>
  </section>

  <section class="card">
    <strong>Items checked out to me</strong>
    <ul id="mine"><li class="muted"><span class="spinner"></span>Loading…</li></ul>
  </section>

  <p class="muted" id="who"></p>
</main>

<script>
  var APP_URL = <?!= JSON.stringify(appUrl) ?>;
  var currentId = <?!= JSON.stringify(itemId) ?>;
  var DETAIL_FIELDS = ['Brand', 'Model', 'S/N', 'Condition', 'Home Location', 'Holder', 'Accessories', 'Last Updated'];
  var lastStatus = null;   // to know when the badge should be stamped
  var lastMine = null;     // item IDs in "checked out to me", to highlight new ones

  function $(id) { return document.getElementById(id); }

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  function showMessage(text, kind) {
    var m = $('msg');
    m.textContent = text;
    m.className = 'msg ' + kind;
    m.hidden = !text;
  }

  /** Disable the controls while the server works; the pressed button shows a spinner and `label`. */
  function busy(on, button, label) {
    ['checkout', 'return', 'lookupBtn', 'note'].forEach(function (id) { $(id).disabled = on; });
    var sel = document.querySelector('#details select');
    if (sel) sel.disabled = on;
    $('item').classList.toggle('working', on);
    if (button) {
      if (on) {
        button.dataset.label = button.textContent;
        button.innerHTML = '';
        button.appendChild(el('span', null, 'spinner'));
        button.appendChild(document.createTextNode(label));
      } else if (button.dataset.label) {
        button.textContent = button.dataset.label;
      }
    }
  }

  function call(fn, args, onOk, button, label) {
    busy(true, button, label);
    var runner = google.script.run
      .withSuccessHandler(function (res) { busy(false, button); onOk(res); })
      .withFailureHandler(function (err) {
        busy(false, button);
        $('loading').hidden = true;
        if (currentId && $('itemId').textContent) $('item').hidden = false;
        showMessage(err.message || String(err), 'error');
      });
    runner[fn].apply(runner, args);
  }

  function render(res) {
    if (!res) { showMessage('The server sent no data. Please reload the page.', 'error'); return; }
    if (res.user) $('who').textContent = 'Signed in as ' + res.user;
    $('loading').hidden = true;
    if (res.error) { showMessage(res.error, 'error'); $('item').hidden = true; $('historyCard').hidden = true; return; }
    var it = res.item;
    var sameItem = currentId === it.ItemID && !$('item').hidden;
    currentId = it.ItemID;
    if (!sameItem) { $('item').hidden = false; restart($('item'), 'fade-in'); }
    $('itemId').textContent = it.ItemID;
    $('itemDesc').textContent = it.Description || '(no description)';

    var status = $('status');
    var mine = it.Holder && res.user && String(it.Holder).toLowerCase() === res.user.toLowerCase();
    if (!it.Active) { status.textContent = 'Inactive'; status.className = 'badge inactive'; }
    else if (it.Status === 'Checked Out') { status.textContent = mine ? 'Checked out to you' : 'Checked out'; status.className = 'badge out stamped'; }
    else { status.textContent = 'Available'; status.className = 'badge available'; }
    var statusKey = it.ItemID + '|' + it.Status + '|' + it.Holder;
    if (sameItem && lastStatus && lastStatus !== statusKey) restart(status, 'stamp');
    lastStatus = statusKey;

    var dl = $('details');
    dl.innerHTML = '';
    DETAIL_FIELDS.forEach(function (f) {
      if (f === 'Condition') { dl.appendChild(el('dt', f)); dl.appendChild(conditionPicker(it, res.conditions)); return; }
      if (it[f] === '' || it[f] == null) return;
      dl.appendChild(el('dt', f));
      dl.appendChild(el('dd', String(it[f])));
    });

    $('checkout').hidden = !(it.Active && it.Status !== 'Checked Out');
    $('return').hidden = it.Status !== 'Checked Out';
    $('return').textContent = mine || !it.Holder ? 'Return' : 'Return (on behalf of ' + it.Holder + ')';
    $('actions').hidden = $('checkout').hidden && $('return').hidden;
    $('note').value = '';

    var list = $('history');
    list.innerHTML = '';
    (res.history || []).forEach(function (h) {
      list.appendChild(el('li', h.when + ' · ' + h.action + ' · ' + h.user + (h.note ? ' — ' + h.note : '')));
    });
    $('historyCard').hidden = !(res.history && res.history.length);
  }

  /** Replay a CSS animation class on an element. */
  function restart(node, cls) {
    node.classList.remove(cls);
    void node.offsetWidth;
    node.classList.add(cls);
  }

  /** Condition as a dropdown that saves as soon as it changes. */
  function conditionPicker(it, conditions) {
    var dd = el('dd', null, 'cond');
    var current = String(it.Condition || 'unknown').toLowerCase();
    var options = (conditions || ['working', 'not working', 'unknown']).slice();
    if (options.indexOf(current) < 0) options.push(current);
    var sel = el('select');
    sel.setAttribute('aria-label', 'Condition');
    options.forEach(function (c) {
      var o = el('option', c);
      o.value = c;
      o.selected = c === current;
      sel.appendChild(o);
    });
    var state = el('span', null, 'state');
    sel.onchange = function () {
      var picked = sel.value;
      state.className = 'state';
      state.innerHTML = '';
      state.appendChild(el('span', null, 'spinner'));
      state.appendChild(document.createTextNode('Saving…'));
      busy(true);
      google.script.run
        .withSuccessHandler(function (res) {
          busy(false);
          render(res);
          var s2 = document.querySelector('#details .cond .state');
          if (s2) { s2.textContent = '✓ Saved'; s2.className = 'state saved'; }
        })
        .withFailureHandler(function (err) {
          busy(false);
          sel.value = current;
          state.textContent = '';
          showMessage(err.message || String(err), 'error');
        })
        .setCondition(it.ItemID, picked);
    };
    dd.appendChild(sel);
    dd.appendChild(state);
    return dd;
  }

  function loadItem(id, button) {
    showMessage('', '');
    if (String(id).toUpperCase() !== currentId || $('item').hidden) {
      $('item').hidden = true;
      $('historyCard').hidden = true;
      $('loading').hidden = false;
    }
    call('getItem', [id], render, button, 'Looking up…');
  }

  function loadMine() {
    google.script.run.withSuccessHandler(function (res) {
      if (!res || !res.items) {
        $('mine').innerHTML = '';
        $('mine').appendChild(el('li', 'Could not load your items. Please reload the page.', 'muted'));
        return;
      }
      if (res.user) $('who').textContent = 'Signed in as ' + res.user;
      var ul = $('mine');
      ul.innerHTML = '';
      var ids = res.items.map(function (it) { return it.ItemID; });
      if (!res.items.length) { ul.appendChild(el('li', 'Nothing right now.', 'muted')); lastMine = ids; return; }
      res.items.forEach(function (it) {
        var li = el('li', null, lastMine && lastMine.indexOf(it.ItemID) < 0 ? 'new' : '');
        var a = el('a', it.ItemID);
        a.href = APP_URL + '?item=' + encodeURIComponent(it.ItemID);
        a.onclick = function (ev) { ev.preventDefault(); loadItem(it.ItemID); };
        li.appendChild(a);
        li.appendChild(document.createTextNode(' ' + (it.Description || '')));
        ul.appendChild(li);
      });
      lastMine = ids;
    }).withFailureHandler(function (err) {
      $('mine').innerHTML = '';
      $('mine').appendChild(el('li', err.message || String(err), 'muted'));
    }).getMyItems();
  }

  function act(fn, button, label, doneText) {
    showMessage('', '');
    call(fn, [currentId, $('note').value], function (res) {
      render(res);
      showMessage(doneText.replace('{id}', currentId), 'ok');
      loadMine();
    }, button, label);
  }

  $('checkout').onclick = function () { act('checkOut', this, 'Checking out…', '{id} is checked out to you.'); };
  $('return').onclick = function () { act('returnItem', this, 'Returning…', '{id} is returned.'); };
  $('lookup').onsubmit = function (ev) {
    ev.preventDefault();
    var id = $('lookupId').value.trim();
    if (id) loadItem(id, $('lookupBtn'));
  };

  if (currentId) loadItem(currentId);
  loadMine();
</script>
</body>
</html>
