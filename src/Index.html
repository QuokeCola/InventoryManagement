<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Roboto:wght@400;500;700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---- Tokens ----------------------------------------------------------- */
    :root {
      --paper: #eef2f5; --panel: #ffffff; --ink: #14202b; --muted: #5c6b7a; --line: #cfd8e1;
      --primary: #00274c; --on-primary: #ffffff;
      --ok: #1d7a45; --out: #b45f06; --off: #98a4b1; --bad: #b3261e;
      --glass-top: rgba(255,255,255,.98); --glass: rgba(240,245,250,.94); --glass-edge: #c5d2df;
      --glass-shine: #ffffff; --glass-shadow: rgba(0,39,76,.30);
      --display: "Saira Semi Condensed", "Arial Narrow", sans-serif;
      --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ease-out: cubic-bezier(.2,.9,.25,1.05);
      --panel-w: 320px;
      --rack-step: 62px; --slab-h: 112px; --slab-open: 200px;

      /* the item card, in the style of the home dashboard cards */
      --ha-card: #2b2c29; --ha-raised: #33342f; --ha-sunk: #232420; --ha-line: #3d3e38;
      --ha-ink: #ece8df; --ha-muted: #8f8b82; --ha-tan: #c9a46b; --ha-tan-ink: #1f1c16;
      --ha-ok: #9db48a; --ha-off: #77746c; --ha-bad: #e08a78;
      --ha-font: "Roboto", "Helvetica Neue", Arial, sans-serif;
      --card-w: 380px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0d1217; --panel: #151c24; --ink: #e7ecf1; --muted: #93a1b0; --line: #2b3644;
        --primary: #ffcb05; --on-primary: #14202b;
        --ok: #5ccf8a; --out: #f0b04a; --off: #5d6978; --bad: #ff8a80;
        --glass-top: rgba(58,68,84,.98); --glass: rgba(34,41,52,.96); --glass-edge: #455269;
        --glass-shine: rgba(255,255,255,.2); --glass-shadow: rgba(0,0,0,.7);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--ha-tan); outline-offset: 2px; }

    /* ---- Layout: side panel + archive ------------------------------------- */
    .app { display: grid; grid-template-columns: var(--panel-w) 1fr; min-height: 100%; }
    .panel { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel);
             border-right: 1px solid var(--line); padding: 20px 18px 28px; z-index: 30; }
    .archive { position: relative; min-width: 0; padding: 22px 0 60px; }

    .brand { font: 700 1.45rem/1.1 var(--display); letter-spacing: .01em; margin: 0; }
    .who { color: var(--muted); font-size: .82rem; margin: 2px 0 18px; overflow-wrap: anywhere; }

    .search input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
    .search input::placeholder { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
    .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer;
            font-size: .85rem; transition: background .2s, color .2s, border-color .2s; }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); cursor: pointer; }
    .result-count { font-size: .85rem; color: var(--muted); margin: 10px 0 0; font-variant-numeric: tabular-nums; }
    .matches { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
    .matches button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
                      padding: 6px 8px; border-radius: 8px; font-size: .88rem; }
    .matches button:hover, .matches button:focus-visible { background: var(--paper); }
    .matches b { font: 600 .95rem var(--display); min-width: 54px; }
    .matches span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-section { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
    .panel-title { display: flex; justify-content: space-between; align-items: baseline; font: 600 1.05rem var(--display); margin: 0; }
    .panel-title span { font: 400 .85rem var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
    .topbar { display: none; }
    .secondary-btn { border: 1px solid var(--primary); background: transparent; color: var(--primary); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 600; }
    .primary-btn { border: 0; background: var(--primary); color: var(--on-primary); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 600; }
    .primary-btn:disabled, .secondary-btn:disabled { opacity: .55; cursor: wait; }

    /* ---- 3D archive ------------------------------------------------------------ */
    body.mode3d .archive { height: 100vh; padding: 0; overflow: hidden; }
    body.mode3d #groups { display: none; }
    .stage3d { position: absolute; inset: 0; }
    .stage3d canvas { display: block; cursor: grab; }
    .stage3d canvas:active { cursor: grabbing; }
    .nav { position: absolute; left: 32px; bottom: 26px; z-index: 5; display: flex; align-items: flex-end; gap: 22px; }
    .nav-lane { font-size: .85rem; color: var(--muted); }
    .nav-lane b { font: 600 .95rem var(--display); color: var(--ink); margin-right: 8px; }
    .nav-count { font: 700 2.4rem/1 var(--display); font-variant-numeric: tabular-nums; }
    .nav-count span { font: 500 1rem var(--display); color: var(--muted); margin-left: 6px; }
    .nav-arrows { display: grid; grid-template-columns: repeat(4, 34px); gap: 6px; }
    .nav-arrows button { height: 34px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 80%, transparent);
                         border-radius: 8px; cursor: pointer; font-size: 1rem; }
    .nav-arrows button:hover { border-color: var(--ink); }
    .nav-hint { color: var(--muted); font-size: .8rem; max-width: 240px; }

    /* ---- 2D fallback archive: rows of plain tiles ---------------------------------- */
    .row { margin-bottom: 18px; }
    .row-head { display: flex; align-items: baseline; gap: 10px; padding: 0 28px; }
    .row-code { font: 700 1.5rem/1 var(--display); letter-spacing: .02em; }
    .row-name { color: var(--muted); }
    .row-count { margin-left: auto; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .track { display: flex; gap: 14px; overflow-x: auto; padding: 22px 28px; scroll-snap-type: x proximity; scrollbar-width: thin; }
    .tile { position: relative; flex: 0 0 auto; width: 128px; height: 150px; padding: 12px; border-radius: 4px; cursor: pointer;
            scroll-snap-align: start; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
            background: linear-gradient(180deg, var(--glass-top), var(--glass)); border: 1px solid var(--glass-edge);
            box-shadow: 0 14px 22px -16px var(--glass-shadow); transition: transform .35s var(--ease-out), box-shadow .3s; }
    .tile:hover { transform: translateY(-6px); box-shadow: 0 22px 28px -18px var(--glass-shadow); }
    .tile.selected { transform: translateY(-14px); }
    .tile.inactive { opacity: .55; }
    .tile b { font: 700 1.3rem/1 var(--display); }
    .tile span { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile em { font-style: normal; font-size: .72rem; font-weight: 600; }
    .st-available { color: var(--ok); } .st-out { color: var(--out); } .st-mine { color: var(--out); } .st-inactive { color: var(--off); }
    .skel .tile { cursor: default; background: var(--line); border-color: transparent; box-shadow: none; animation: pulse 1.2s ease-in-out infinite; }
    .skel .row-code { width: 60px; height: 22px; background: var(--line); border-radius: 6px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
    .empty { padding: 40px 28px; color: var(--muted); }

    /* ---- The item card (dashboard style) --------------------------------------------- */
    .scrim { position: fixed; inset: 0; background: rgba(13,18,23,.4); opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 40; }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .card { position: fixed; z-index: 50; right: 28px; top: 50%; transform: translateY(-50%); width: var(--card-w);
            max-height: calc(100vh - 56px); overflow-y: auto; overscroll-behavior: contain;
            background: var(--ha-card); color: var(--ha-ink); font: 13px/1.45 var(--ha-font);
            border: 1px solid var(--ha-line); border-radius: 3px; padding: 18px 18px 16px;
            box-shadow: 0 34px 70px -24px rgba(0,0,0,.65), 0 2px 0 rgba(255,255,255,.03) inset;
            scrollbar-width: thin; scrollbar-color: var(--ha-line) transparent; }
    .card::before { content: ""; position: absolute; top: 0; left: 0; height: 2px; width: 30%; background: var(--ha-tan);
                    opacity: 0; transform: translateX(-100%); }
    .card.working::before { opacity: 1; animation: progress 1.1s ease-in-out infinite; }
    @keyframes progress { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    .card .cap { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ha-muted); margin: 0; }
    .card-head { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: start; }
    .card-head h2 { margin: 0; font: 700 22px/1.15 var(--ha-font); letter-spacing: .02em; }
    .card-head .status { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .card-head .status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
    .card-head .status.available { color: var(--ha-ok); } .card-head .status.out, .card-head .status.mine { color: var(--ha-tan); }
    .card-head .status.inactive { color: var(--ha-off); }
    .icon-btn { width: 30px; height: 30px; border: 1px solid var(--ha-line); background: var(--ha-raised); color: var(--ha-ink);
                border-radius: 3px; cursor: pointer; font-size: 16px; line-height: 1; grid-row: 1 / span 3; grid-column: 2; }
    .icon-btn:hover { border-color: var(--ha-muted); }
    .rule { height: 1px; background: var(--ha-line); margin: 14px 0; transition: background .3s, height .3s; }
    .rule.active { height: 2px; background: var(--ha-tan); }

    .photo { margin: 0; aspect-ratio: 16 / 10; background: var(--ha-sunk); border: 1px solid var(--ha-line); border-radius: 2px;
             position: relative; overflow: hidden; display: grid; place-items: center; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .photo svg line { stroke: var(--ha-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .photo figcaption { position: relative; padding: 4px 10px; background: var(--ha-sunk); }

    .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin: 16px 0 4px; }
    .rows .wide { grid-column: 1 / -1; }
    .rows .val { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
    .rows select { width: 100%; background: var(--ha-raised); color: var(--ha-ink); border: 1px solid var(--ha-line); border-radius: 3px;
                   padding: 4px 6px; font: 500 13px var(--ha-font); }
    .rows .saved { color: var(--ha-ok); }
    .note { width: 100%; margin-top: 14px; padding: 8px 10px; background: var(--ha-sunk); color: var(--ha-ink); border: 1px solid var(--ha-line);
            border-radius: 3px; resize: vertical; font: 13px var(--ha-font); }
    .note::placeholder { color: var(--ha-muted); }
    .act { width: 100%; margin-top: 8px; padding: 11px; border: 0; border-radius: 3px; cursor: pointer;
           background: var(--ha-tan); color: var(--ha-tan-ink); font: 700 12px var(--ha-font); letter-spacing: .14em; text-transform: uppercase;
           transition: transform .1s ease, filter .2s; }
    .act:hover { filter: brightness(1.08); }
    .act:active:not(:disabled) { transform: scale(.985); }
    .act.return { background: var(--ha-raised); color: var(--ha-ink); border: 1px solid var(--ha-tan); }
    .act:disabled { opacity: .6; cursor: wait; }
    .notice { color: var(--ha-muted); margin: 14px 0 0; }
    .history { margin-top: 18px; }
    .history ol { list-style: none; margin: 8px 0 0; padding: 0; }
    .history li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--ha-line); }
    .history li .cap { white-space: nowrap; }
    .card-body.swap { animation: swap .3s var(--ease-out); }
    @keyframes swap { from { opacity: 0; transform: translateY(6px); } }

    .spinner { display: inline-block; width: 1em; height: 1em; vertical-align: -.15em; margin-right: .5em;
               border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stamp { animation: stamp .45s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes stamp { 0% { opacity: 0; transform: scale(1.6); } 60% { opacity: 1; transform: scale(.95); } }

    /* 2D fallback: the card is a centred dialog */
    body:not(.mode3d) .card { right: 50%; transform: translate(50%, -50%); }

    /* ---- Toast -------------------------------------------------------------- */
    .toast { position: fixed; left: 50%; bottom: 22px; z-index: 60; max-width: min(92vw, 460px); padding: 12px 16px; border-radius: 4px;
             background: var(--ha-card); color: var(--ha-ink); font: 13px var(--ha-font); box-shadow: 0 16px 30px -12px rgba(0,0,0,.4);
             transform: translate(-50%, 20px); opacity: 0; transition: opacity .25s ease, transform .35s var(--ease-out); pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--bad); color: #fff; }

    /* ---- "Checked out to me" stack in the side panel -------------------------------- */
    .rack { position: relative; margin: 12px -4px 0; padding: 0 4px; perspective: 1100px; perspective-origin: 50% -40%;
            transition: height .5s cubic-bezier(.2,.8,.2,1); }
    .slab { position: absolute; left: 4px; right: 4px; top: 0; height: var(--slab-h);
            padding: 12px 14px; border-radius: 6px; cursor: pointer; color: var(--ink);
            background: linear-gradient(180deg, var(--glass-top), var(--glass) 40%); border: 1px solid var(--glass-edge);
            box-shadow: inset 0 1px 0 var(--glass-shine), 0 -2px 0 -1px var(--glass-shine), 0 10px 18px -12px var(--glass-shadow);
            transform-origin: 50% 0; transform: translateY(var(--y)) rotateX(var(--tilt, 20deg)) translateZ(var(--z, 0px));
            transition: transform .55s var(--ease-out), height .45s ease, box-shadow .3s ease, opacity .4s ease;
            transition-delay: var(--delay, 0ms); overflow: hidden; }
    .slab:hover:not(.open) { --z: 16px; }
    .slab.open { --tilt: 0deg; --z: 34px; height: var(--slab-open); box-shadow: inset 0 1px 0 var(--glass-shine), 0 28px 40px -20px var(--glass-shadow); }
    .slab-id { font: 700 1.2rem/1.25 var(--display); letter-spacing: .02em; }
    .slab-desc { font-size: .88rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slab-body { margin-top: 10px; opacity: 0; transform: translateY(6px); transition: opacity .25s ease, transform .25s ease; }
    .slab.open .slab-body { opacity: 1; transform: none; transition-delay: .2s; }
    .slab-body dl { margin: 0; font-size: .85rem; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
    .slab-body dt { color: var(--muted); } .slab-body dd { margin: 0; }
    .slab-actions { display: flex; gap: 8px; margin-top: 10px; }
    .slab-actions button { flex: 1; margin: 0; padding: 8px; font-size: .88rem; }
    .slab.arriving { animation: arrive .6s cubic-bezier(.2,.9,.25,1.1) backwards; }
    @keyframes arrive { from { opacity: 0; transform: translateY(calc(var(--y) - 60px)) rotateX(70deg); } }
    .slab.leaving { opacity: 0; --tilt: -25deg; --y: -90px !important; pointer-events: none; }
    .rack-empty { color: var(--muted); font-size: .88rem; margin: 10px 0 0; }

    /* ---- Phones ---------------------------------------------------------------------- */
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .panel { position: fixed; left: 0; top: 0; bottom: 0; width: min(88vw, 340px); height: auto;
               transform: translateX(-102%); transition: transform .4s var(--ease-out); box-shadow: 20px 0 40px -20px rgba(0,0,0,.35); z-index: 45; }
      .panel.open { transform: none; }
      .topbar { display: flex; align-items: center; gap: 12px; padding: 0 16px 6px; }
      .topbar .brand { font-size: 1.25rem; }
      .menu-btn { margin-left: auto; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
      body.mode3d .archive { height: 100vh; height: 100dvh; }
      body.mode3d .topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 6; padding: 12px 16px; }
      .row-head { padding: 0 16px; } .track { padding: 18px 16px; } .empty { padding: 30px 16px; }
      .archive { padding-top: 14px; }
      .nav { left: auto; right: 12px; top: 58px; bottom: auto; flex-direction: column; align-items: flex-end; gap: 8px; }
      .nav-count { font-size: 1.6rem; }
      .nav-arrows { grid-template-columns: repeat(2, 38px); }
      .nav-arrows button { height: 38px; }
      .nav-hint, .nav-lane { display: none; }
      .card, body:not(.mode3d) .card { left: 0; right: 0; top: auto; bottom: 0; width: auto; transform: none;
              max-height: 66vh; max-height: 66dvh; border-radius: 6px 6px 0 0; border-width: 1px 0 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0s !important; transition-delay: 0s !important; }
      .card.working::before { transform: none; width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel" aria-label="Search and your items">
    <h1 class="brand">Lab Inventory</h1>
    <p class="who" id="who">Signing in…</p>

    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Search ID, name, brand, location" autocomplete="off" aria-label="Search items">
    </form>
    <div class="chips" role="group" aria-label="Filter by status">
      <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-filter="available" aria-pressed="false">Available</button>
      <button class="chip" type="button" data-filter="out" aria-pressed="false">Checked out</button>
      <button class="chip" type="button" data-filter="mine" aria-pressed="false">Mine</button>
    </div>
    <label class="toggle"><input type="checkbox" id="showInactive"> Show retired and missing items</label>
    <p class="result-count" id="resultCount"></p>
    <ul class="matches" id="matches" hidden></ul>

    <section class="panel-section">
      <h2 class="panel-title">Checked out to me <span id="mineCount"></span></h2>
      <div id="mine" class="rack" aria-live="polite"><p class="rack-empty"><span class="spinner"></span>Loading…</p></div>
    </section>
  </aside>

  <main class="archive" id="archive">
    <div class="topbar">
      <span class="brand">Lab Inventory</span>
      <button class="menu-btn" id="menuBtn" type="button" aria-controls="panel" aria-expanded="false">Search</button>
    </div>
    <div id="stage3d" class="stage3d" hidden></div>
    <div class="nav" id="nav" hidden>
      <div>
        <div class="nav-lane" id="navLane"></div>
        <div class="nav-count"><span id="navIndex" style="font: inherit; color: inherit; margin: 0">01</span><span>/ <span id="navTotal" style="margin:0">01</span></span></div>
      </div>
      <div class="nav-arrows">
        <button type="button" id="navUp" aria-label="Previous item in this row">↑</button>
        <button type="button" id="navDown" aria-label="Next item in this row">↓</button>
        <button type="button" id="navLeft" aria-label="Previous row">←</button>
        <button type="button" id="navRight" aria-label="Next row">→</button>
      </div>
      <div class="nav-hint">Drag or scroll to browse. Click a block to open it.</div>
    </div>
    <div id="groups"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<section class="card" id="card" role="dialog" aria-labelledby="cId" hidden>
  <div class="card-body" id="cBody">
    <header class="card-head">
      <h2 id="cId"></h2>
      <button class="icon-btn" id="cClose" type="button" aria-label="Close">×</button>
      <p class="cap" id="cDesc"></p>
      <p class="cap status" id="cStatus"><i></i><span></span></p>
    </header>
    <div class="rule" id="cRule"></div>
    <figure class="photo" id="cPhoto"></figure>
    <div class="rows" id="cRows"></div>
    <div id="cActions">
      <textarea class="note" id="cNote" rows="2" placeholder="Note (optional): where it's going, which project"></textarea>
      <button class="act" id="cAct" type="button"></button>
    </div>
    <p class="notice" id="cNotice" hidden></p>
    <section class="history" id="cHistory" hidden>
      <p class="cap">Recent activity</p>
      <ol id="cHistoryList"></ol>
    </section>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<?!= include('Archive3D'); ?>

<script>
  var APP_URL = <?!= JSON.stringify(appUrl) ?>;
  var START_ID = <?!= JSON.stringify(itemId) ?>;

  var state = {
    user: '', items: [], byId: {}, conditions: ['working', 'not working', 'unknown'],
    filter: 'all', q: '', showInactive: false,
    openId: null,        // item shown in the card
    openSlab: null,      // slab pulled out of the side-panel stack
    lastMine: null,
    mode: 'pending',     // 'pending' until we know whether the 3D view can run, then '3d' or '2d'
  };
  var STATUS_OUT = 'Checked Out';
  var archive3d = null, lanesKey = '';

  // ---- small helpers ----------------------------------------------------------
  function $(id) { return document.getElementById(id); }
  function el(tag, text, cls) {

      s.setAttribute('aria-expanded', String(isOpen));
      s.style.setProperty('--y', y + 'px');
      s.style.setProperty('--delay', openIndex < 0 ? '0ms' : Math.abs(i - openIndex) * 45 + 'ms');
      y += isOpen ? openH + 12 : step;
      if (i === openIndex - 1) y += 10;
    });
    var last = slabs.length - 1;
    var height = slabs.length ? y - (last === openIndex ? openH + 12 : step) + (last === openIndex ? openH : slabH) + 4 : 0;
    rack.style.height = Math.max(height, 0) + 'px';
  }

  function returnFromRack(id, slab, button) {
    setBusy(button, 'Returning…');
    server('returnItem', [id, ''], function (res) {
      slab.classList.add('leaving');
      if (state.openSlab === id) state.openSlab = null;
      layoutRack();
      toast(id + ' is returned.');
      setTimeout(function () {
        updateItem(res.item);
        if (state.openId === id) renderCard(state.byId[id.toUpperCase()], res.history, false);
      }, 420);
    }, function () { unsetBusy(button); });
  }

  // ---- wiring -------------------------------------------------------------------
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.onclick = function () { setFilter(c.dataset.filter); };
  });
  var searchTimer;
  $('q').oninput = function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { state.q = $('q').value.trim(); renderArchive(); }, 120);
  };
  $('searchForm').onsubmit = function (ev) {
    ev.preventDefault();
    var exact = $('q').value.trim().toUpperCase();
    state.q = $('q').value.trim();
    renderArchive();
    if (state.byId[exact]) openCard(exact);    // an exact ID and Enter opens it
  };
  $('showInactive').onchange = function () { state.showInactive = this.checked; renderArchive(); };
  $('menuBtn').onclick = openPanel;
  $('cClose').onclick = closeCard;
  $('scrim').onclick = function () { if ($('panel').classList.contains('open')) closePanel(); else closeCard(); };
  $('navUp').onclick = function () { archive3d && archive3d.move(0, -1); };
  $('navDown').onclick = function () { archive3d && archive3d.move(0, 1); };
  $('navLeft').onclick = function () { archive3d && archive3d.move(-1, 0); };
  $('navRight').onclick = function () { archive3d && archive3d.move(1, 0); };
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if ($('panel').classList.contains('open')) closePanel(); else closeCard(); return; }
    if (!archive3d || /INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) return;
    var moves = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
    if (moves[ev.key]) { ev.preventDefault(); archive3d.move(moves[ev.key][0], moves[ev.key][1]); }
    else if (ev.key === 'Enter') { var cur = archive3d.current(); if (cur) { ev.preventDefault(); openCard(cur.item.ItemID); } }
  });
  window.addEventListener('resize', function () { if (archive3d && state.openId) archive3d.setInsets(cardInsets()); });

  // ---- start --------------------------------------------------------------------
  renderSkeleton();
  // The 3D module loads from a CDN; fall back to the 2D archive if it fails or takes too long.
  if (window.Archive3D) chooseMode(Archive3D.supported);
  else {
    window.addEventListener('archive3d-ready', function () { chooseMode(Archive3D.supported); });
    setTimeout(function () { chooseMode(false); }, 9000);
  }
  if (START_ID) openCard(START_ID);
  server('getAllItems', [], function (res) {
    if (!res || !res.items) { toast('Could not load the inventory. Reload the page to try again.', true); return; }
    state.user = res.user;
    state.conditions = res.conditions || state.conditions;
    state.items = res.items;
    state.byId = {};
    res.items.forEach(function (it) { state.byId[String(it.ItemID).toUpperCase()] = it; });
    $('who').textContent = 'Signed in as ' + res.user;
    renderArchive();
    renderRack();
    if (state.openId && state.byId[state.openId]) renderCard(state.byId[state.openId], null, false);
  });
</script>
</body>
</html>
