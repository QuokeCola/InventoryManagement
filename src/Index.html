<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* After RhineLabUI: a warm off-white field, black type, thin rules, small spaced capitals, and one warm amber
     for whatever is selected or out. The colours match Archive3D's THEMES. */
  :root {
    --paper: #ebe7e1; --panel: #f6f3ee; --ink: #1b1b1b; --muted: #7d766c; --line: rgba(27, 27, 27, .14);
    --accent: #b8742a; --primary: #1b1b1b; --on-primary: #f6f3ee;
    --ok: #3f8a5c; --out: #b06a22; --off: #a0988d; --bad: #b3261e;
    --display: Manrope, "IBM Plex Sans", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --ease: cubic-bezier(.2,.8,.2,1);
    --edge: clamp(20px, 3.2vw, 52px); /* the HUD's margin */
    /* ...from each side of the screen, kept clear of a phone's notch, rounded corners and home indicator where
       the 3D field runs under them (viewport-fit=cover, set in Code.gs) */
    --edge-t: calc(var(--edge) + env(safe-area-inset-top, 0px)); --edge-r: calc(var(--edge) + env(safe-area-inset-right, 0px));
    --edge-b: calc(var(--edge) + env(safe-area-inset-bottom, 0px)); --edge-l: calc(var(--edge) + env(safe-area-inset-left, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0d0e10; --panel: #17191c; --ink: #eef0f2; --muted: #9aa3ad; --line: rgba(238, 240, 242, .14);
      --accent: #ffcb05; --primary: #eef0f2; --on-primary: #0d0e10;
      --ok: #62de96; --out: #ffb347; --off: #6b7580; --bad: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  /* No scroll bars anywhere. Things still scroll; the sheet and the search hits fade out at an edge with more
     beyond it instead (--fade-top / --fade-bottom, set by edgeFade). */
  html, .panel, .matches, .sheet-body, textarea { scrollbar-width: none; }
  ::-webkit-scrollbar { display: none; }
  .matches, .sheet-body { mask-image: linear-gradient(transparent, #000 var(--fade-top, 0px), #000 calc(100% - var(--fade-bottom, 0px)), transparent); }
  html { background: var(--paper); } /* Safari's fallback for its bars; transparent would be white */
  body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cap { font: 500 .72rem/1.4 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
  kbd { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; padding: 0 .3em; border: 1px solid var(--line);
        font: 500 .7rem var(--mono); color: var(--muted); }
  .btn { border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 0; padding: 7px 12px;
         font-size: .75rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .btn.fill { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .st-available { color: var(--ok); } .st-out, .st-mine { color: var(--out); } .st-inactive { color: var(--off); }
  .spinner { display: inline-block; width: 1em; height: 1em; vertical-align: -.15em; margin-right: .5em;
             border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brand { margin: 0; font: 800 clamp(1.6rem, 2.5vw, 2.4rem)/.95 var(--display); letter-spacing: .01em; text-transform: uppercase; }
  .brand small { display: block; margin-top: .3em; font-size: .42em; font-weight: 700; letter-spacing: .06em; }
  .brand small b { font-weight: 800; }

  /* ---- The search drawer: slides in from the right over the archive -------------- */
  .panel { position: fixed; right: 0; top: 0; bottom: 0; z-index: 45; width: min(92vw, 380px); overflow-y: auto; overscroll-behavior: contain;
           background: var(--panel); border-left: 1px solid var(--line);
           padding: calc(26px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 24px; box-shadow: -24px 0 48px -28px rgba(0,0,0,.35);
           transform: translateX(104%); display: none; transition: transform .3s var(--ease), display .3s allow-discrete; }
  .panel.open { transform: none; display: block; }
  @starting-style { .panel.open { transform: translateX(104%); } }
  /* Safari 26 colours its toolbars from fixed elements along the screen's edges that have a background, even hidden
     ones. So a closed drawer is display: none, and the scrim's and scanner's colour sits on a child (::before), which
     Safari doesn't look at; with nothing to sample, the bars stay clear glass over the 3D field. */
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .panel-head h2 { margin: 0; font: 700 .8rem var(--body); letter-spacing: .14em; text-transform: uppercase; }
  .panel .x { border: 1px solid var(--line); background: none; width: 30px; height: 30px; line-height: 1; }
  .who { color: var(--muted); font-size: .8rem; margin: 0 0 18px; overflow-wrap: anywhere; }
  .search input { width: 100%; padding: 10px 0; border: 0; border-bottom: 1.5px solid var(--ink); border-radius: 0; background: transparent; font-size: 1rem; }
  .search input:focus { outline: none; border-bottom-color: var(--accent); }
  .search input::placeholder { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 10px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 0; padding: 4px 10px; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); cursor: pointer; }
  .result-count { font: 500 .72rem var(--mono); color: var(--muted); margin: 12px 0 0; letter-spacing: .06em; }
  .matches { list-style: none; margin: 8px 0 0; padding: 0; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--line); }
  .matches button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent;
                    padding: 8px 2px; font-size: .86rem; }
  .matches button:hover, .matches button:focus-visible { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .matches b { font: 500 .8rem var(--mono); min-width: 64px; letter-spacing: .04em; }
  .matches span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-title { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 0; padding-top: 16px;
                 border-top: 1.5px solid var(--ink); font: 700 .8rem var(--body); letter-spacing: .14em; text-transform: uppercase; }
  .panel-title span { font: 500 .8rem var(--mono); color: var(--muted); }
  .mine { list-style: none; margin: 10px 0 0; padding: 0; color: var(--muted); font-size: .86rem; }
  .mine li[data-id] { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .mine .open { min-width: 0; border: 0; padding: 0; background: none; text-align: left; display: grid; }
  .mine .open > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mine b { font: 800 1.05rem/1.25 var(--display); color: var(--ink); }
  .mine small { font-size: .76rem; }

  /* ---- The archive --------------------------------------------------------------
     On a desktop it is the 3D field (Archive3D) under a HUD: the brand and tools along the top, the selected
     item's block to the right of it, and the place in the group and the group along the bottom. Open an item
     (click its card, its block's Open, or Enter) and the card lifts, the camera swings round to it and the
     view slides it to the left; the item's sheet comes in on the right. On a phone held upright the same,
     stacked: the card above, the HUD's block and then the sheet below. Without WebGL (body.flat) it is a plain
     list by group instead, and the sheet opens in place of the row that was tapped. */
  .archive { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
  /* Safari's toolbars float over the page, and Safari 26 makes them solid over a page that doesn't scroll under them:
     a fixed full-screen layer, or a page at the very top. So the archive is in the page's flow and the page starts
     scrolled down by a runway (--runway, see scrollPastRunway). The archive itself runs up into the runway, so what
     Safari shows above the page's top, under its status bar and address bar, is the 3D field too, and down to the
     large viewport's bottom, under the bottom bar. The HUD keeps to the part of the screen the bars leave free: its
     top edge drops by the runway, its bottom edge rises by the bottom bar's height while that is showing. Touches
     on the HUD don't scroll the page (see the touchmove handler). */
  @supports (height: 100lvh) {
    body:not(.flat) { --runway: 0px; --edge-t: calc(var(--edge) + env(safe-area-inset-top, 0px) + var(--runway));
                      --edge-b: calc(var(--edge) + env(safe-area-inset-bottom, 0px) + 100lvh - 100dvh); }
    body:not(.flat) .archive { height: calc(100lvh + var(--runway)); }
  }
  @supports (-webkit-touch-callout: none) and (height: 100lvh) { body:not(.flat) { --runway: 96px; } } /* iOS only: Safari's bars are what it is for */
  .stage3d { position: absolute; inset: 0; }
  .stage3d canvas { display: block; cursor: grab; }
  .stage3d canvas:active { cursor: grabbing; }
  /* a haze along the top and bottom, where the HUD is; and with an item open, a wash over the right, under the sheet */
  .stage3d::before, .stage3d::after { content: ""; position: absolute; inset: 0; pointer-events: none; transition: opacity .5s ease; }
  .stage3d::before { background: linear-gradient(var(--paper), color-mix(in srgb, var(--paper) 0%, transparent) 26%,
                                  color-mix(in srgb, var(--paper) 0%, transparent) 70%, color-mix(in srgb, var(--paper) 85%, transparent)); }
  .stage3d::after { opacity: 0; background: linear-gradient(to left, color-mix(in srgb, var(--paper) 94%, transparent) 30%, color-mix(in srgb, var(--paper) 0%, transparent) 62%); }
  .archive.is-open .stage3d::after { opacity: 1; }

  .hud { position: absolute; z-index: 10; margin: 0; text-shadow: 0 0 14px var(--paper), 0 0 4px var(--paper); transition: opacity .3s ease, visibility 0s; }
  .hud button, button.hud { border: 0; background: none; padding: 0; text-shadow: inherit; }
  .archive.is-open .hud.browse, .archive:not(.is-open) .hud.opened { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .2s ease, visibility 0s .2s; }
  .hud-brand, .hud-sel, .hud-count { pointer-events: none; } /* only the HUD's buttons take clicks; drags and swipes pass to the field */
  .hud-sel button { pointer-events: auto; }
  .hud-brand { left: var(--edge-l); top: var(--edge-t); }
  .hud-tools { right: var(--edge-r); top: calc(var(--edge-t) + 4px); display: flex; gap: 28px; align-items: center; }
  .hud-tools button { display: flex; gap: 8px; align-items: center; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .hud-tools svg { width: 15px; height: 15px; }
  .hud-tools b { font: 500 .8rem var(--mono); min-width: 2ch; }
  .topbar-tools { display: flex; gap: 8px; }
  .hud-back { left: var(--edge-l); top: calc(var(--edge-t) + 112px); display: flex; gap: 12px; align-items: center;
              font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }

  /* the selected item: a crumb, its ID big, a rule running off the edge, its name and status, and Open */
  .hud-sel { left: 54%; top: 42%; right: 0; max-width: 820px; }
  .hud-sel .crumb { display: flex; gap: 14px; }
  .hud-sel h2 { margin: .35em 0 .45em; font: 800 clamp(1.5rem, 2.3vw, 2.2rem)/1 var(--display); letter-spacing: .01em; text-transform: uppercase; }
  .hud-sel h2 span { font-weight: 700; }
  .hud-rule { position: relative; height: 1px; margin-left: -3px; background: color-mix(in srgb, var(--ink) 55%, transparent); }
  .hud-rule::before { content: ""; position: absolute; left: -10px; top: -3px; width: 6px; height: 6px; background: var(--ink); }
  .sel-body { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; padding: 18px 48px 0 0; max-width: 600px; }
  .sel-body .desc { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sel-body .cap { align-self: center; }
  .hud-open { display: inline-flex; gap: 40px; align-items: center; margin: 26px 0 0; font-size: .82rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .hud-open span { font-size: 1.4rem; line-height: 1; transition: transform .25s var(--ease); }
  .hud-open:hover span { transform: translateX(6px); }
  .status-dot { display: inline-flex; align-items: center; gap: .55em; }
  .status-dot::before { content: ""; width: .5em; height: .5em; background: currentColor; }

  /* along the bottom: the place in the group, a scale to step through it, the group, and who is signed in */
  .hud-count { left: var(--edge-l); bottom: calc(var(--edge-b) + 34px); }
  .hud-count .num { margin: 6px 0 0; font: 500 clamp(2.6rem, 4vw, 3.8rem)/1 var(--display); font-variant-numeric: tabular-nums; }
  .hud-count .num b { font-weight: 500; }
  .hud-count .num span { margin-left: .5em; font-size: .38em; color: var(--muted); }
  .hud-count .num i { font-style: normal; }
  .hud-scale { left: 27%; bottom: calc(var(--edge-b) + 40px); display: flex; align-items: center; gap: 22px; }
  .hud-scale button, .hud-lane button { font-size: 1.35rem; line-height: 1; width: 1.6em; height: 1.6em; }
  .ticks { display: flex; align-items: center; gap: 10px; height: 26px; }
  .ticks i { width: 1px; height: 10px; background: color-mix(in srgb, var(--ink) 35%, transparent); transition: height .25s var(--ease), background .25s; }
  .ticks i.on { width: 2px; height: 26px; background: var(--ink); }
  .hud-lane { left: 54%; bottom: calc(var(--edge-b) + 36px); display: flex; align-items: center; gap: 22px; }
  .hud-lane div { min-width: 170px; }
  .hud-lane b { display: block; font-weight: 600; font-size: .92rem; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .hud-keys { left: 27%; bottom: var(--edge-b); display: flex; gap: 14px; font-size: .68rem; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .hud-foot { left: var(--edge-l); right: var(--edge-r); bottom: var(--edge-b); display: flex; justify-content: space-between; pointer-events: none;
              font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .hud-foot span:first-child::before { content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 12px; vertical-align: .15em; background: var(--muted); }
  .topbar { display: none; }

  .list { display: none; color: var(--muted); }
  .lane-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; padding-bottom: 8px; border-bottom: 1.5px solid var(--ink); font: 400 .9rem var(--body); }
  .lane-head b { font: 800 1.3rem/1 var(--display); color: var(--ink); }
  .lane-head span { margin-left: auto; font: 500 .8rem var(--mono); }
  .item { margin: 0; padding: 12px 2px; border-bottom: 1px solid var(--line); color: var(--ink); cursor: pointer; }
  .item.inactive { opacity: .55; }
  .item .head .file { display: none; }
  .item .head h3 { margin: 0 0 2px; font-size: 1.05rem; }
  .item.open { display: none; } /* the sheet stands in for it */

  /* The item's sheet. In 3D it stands in the right part of the view, on the wash, beside the lifted card: its
     heading at the top, the Check out / Return button at the bottom, and between them the details, recent
     activity and the note box, which scroll if they don't fit (with a little room either side, so that borders and
     focus rings aren't cut off). It appears when the camera gets there (.show), with a loader until the item's
     details are in (.loading); then its parts pop in one after another (.pop). */
  .sheet { position: absolute; right: calc(var(--edge-r) + 2vw); top: calc(var(--runway, 0px) + (100% - var(--runway, 0px)) * .5); /* the middle of what's on screen */ z-index: 20; width: min(560px, 40vw); max-height: calc(100% - var(--edge-t) - var(--edge-b) - 150px);
           display: flex; flex-direction: column; transform: translateY(-46%);
           opacity: 0; visibility: hidden; transition: opacity .18s, transform .18s, visibility 0s .18s; }
  .sheet > * { flex: none; }
  .sheet > .sheet-body { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 -8px; padding: 2px 8px 6px; }
  .sheet-actions { padding-top: 14px; }
  .sheet-actions .act { margin-top: 0; }
  .sheet.show { opacity: 1; visibility: visible; transform: translateY(-50%); transition: opacity .3s, transform .4s var(--ease), visibility 0s; }
  .sheet .close { display: none; position: absolute; right: 12px; top: 12px; width: 2.2em; height: 2.2em; border: 1px solid var(--line); background: transparent; line-height: 1; }
  .loader { display: none; gap: .5em; align-items: center; margin: 0; color: var(--muted); animation: fade .3s .2s backwards; }
  .loader i { width: .55em; height: .55em; background: currentColor; animation: blink 1s ease-in-out infinite; }
  .loader i:nth-child(2) { animation-delay: .15s; } .loader i:nth-child(3) { animation-delay: .3s; margin-right: .4em; }
  @keyframes blink { 0%, 100% { opacity: .2; transform: scale(.7); } 40% { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } }
  .sheet.loading .loader { display: flex; }
  .sheet.loading .rule, .sheet.loading .col { display: none; }
  .sheet.pop .rule, .sheet.pop .rows > *, .sheet.pop .col > * { animation: pop .5s var(--ease) calc(var(--i, 0) * 40ms) backwards; }
  .sheet.pop .col > .rows { animation: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(.8em); } }

  .head { display: grid; grid-template-columns: minmax(0, 1fr); }
  .head > * { margin: 0; }
  .head .file { display: flex; justify-content: space-between; gap: 12px; }
  .head h3 { margin: .45em 0 .1em; font: 800 clamp(1.5rem, 2.4vw, 2.3rem)/1.08 var(--display); letter-spacing: -.005em; overflow-wrap: anywhere; }
  .head .sub { display: flex; gap: 16px; align-items: baseline; color: var(--muted); }
  .head .sub b { font: 500 .95rem var(--mono); color: var(--ink); letter-spacing: .04em; }
  .status { font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .rule { height: 1.5px; background: var(--ink); margin: 18px 0 20px; }
  .rule.active { background: var(--out); }
  .col { min-width: 0; }
  .col + .col { margin-top: 22px; }
  .photo { display: none; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; margin-bottom: 18px; } /* in 3D it is on the card */
  body.flat .photo { display: block; }
  .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  .rows .wide { grid-column: 1 / -1; }
  .rows .val { font-weight: 500; overflow-wrap: anywhere; }
  .rows .cap { margin-bottom: 3px; }
  .col select, .col textarea { width: 100%; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--ink) 40%, transparent); border-radius: 0; padding: .1em 0 .25em;
                               background: transparent; font-weight: 500; }
  .col option { background: var(--panel); }
  .col textarea { display: block; padding: .6em .1em; resize: none; field-sizing: content; min-height: 4.6em; max-height: 8em; /* grows with the note */
                  border: 1px solid var(--line); border-width: 1px 0; }
  .col textarea::placeholder { color: var(--muted); }
  .act { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 12px; padding: 14px 18px; font-size: .78rem; }
  .act::after { content: "→"; font-size: 1.2em; letter-spacing: 0; }
  .act:disabled::after { content: none; }
  .notice { color: var(--muted); margin: 0; }
  .history { list-style: none; margin: 6px 0 0; padding: 0; font-size: .88rem; }
  .history li { display: flex; justify-content: space-between; gap: 10px; padding: .45em 0; border-top: 1px solid var(--line); }
  .history .cap { white-space: nowrap; }

  body.flat .archive { height: auto; overflow: visible;
                      padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(60px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px)); }
  body.flat .stage3d, body.flat .hud { display: none; }
  body.flat .list { display: block; }
  body.flat .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  body.flat .topbar .brand { font-size: 1.35rem; }
  body.flat .sheet > .sheet-body { overflow: visible; margin: 0; padding: 0; mask-image: none; }
  body.flat .sheet { position: relative; right: auto; top: 0; display: block; width: auto; max-height: none; margin: 0 0 8px; padding: 16px; transform: none;
                     background: var(--panel); border: 1px solid var(--line); opacity: 1; visibility: visible; }
  body.flat .sheet .close { display: block; }
  body.flat .sheet .head { padding-right: 3em; }

  .scrim { position: fixed; inset: 0; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .scrim::before { content: ""; position: absolute; inset: 0; background: rgba(20, 18, 16, .22); }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: min(92vw, 460px); padding: 12px 16px;
           background: var(--ink); color: var(--paper); font-size: .86rem; box-shadow: 0 16px 30px -12px rgba(0,0,0,.4);
           transform: translate(-50%, 20px); opacity: 0; transition: opacity .25s ease, transform .35s var(--ease); pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--bad); color: #fff; }

  /* narrower desktops: the bottom row loses its key hints, and the selection block moves in a little */
  @media (max-width: 1180px) {
    .hud-keys { display: none; }
    .hud-scale { left: 24%; bottom: calc(var(--edge-b) + 24px); }
    .hud-lane { bottom: calc(var(--edge-b) + 20px); }
    .hud-count { bottom: calc(var(--edge-b) + 24px); }
    .hud-foot { display: none; }
  }
  /* phones held upright, after RhineLabUI's portrait layout: the field above, the selection's block and the group
     along the bottom; an open card at the top with its sheet below. Buttons are at least 44px to tap. */
  @media (max-width: 760px) {
    :root { --edge: 18px; }
    .brand { font-size: 1.3rem; }
    .hud-tools { top: calc(var(--edge-t) - 10px); gap: 14px; }
    .hud-tools button { min-height: 44px; font-size: .7rem; }
    .hud-tools kbd, .hud-tools .tool-label, .hud-tools [data-panel="mine"], .hud-scale, .hud-keys, .hud-foot { display: none; } /* "mine" is in the search drawer */
    .hud-tools [data-panel="search"] { justify-content: center; min-width: 44px; }
    .hud-back { top: calc(var(--edge-t) + 44px); min-height: 44px; font-size: .7rem; }
    .hud-sel { left: var(--edge-l); right: var(--edge-r); top: auto; bottom: calc(var(--edge-b) + 84px); }
    .hud-sel h2 { font-size: 1.5rem; }
    .sel-body { padding: 14px 0 0; }
    .hud-open { min-height: 44px; margin-top: 6px; }
    .hud-count { bottom: calc(var(--edge-b) - 4px); }
    .hud-count .num { font-size: 2.4rem; }
    .hud-lane { left: auto; right: calc(var(--edge-r) - 10px); bottom: calc(var(--edge-b) - 2px); gap: 0; }
    .hud-lane div { min-width: 0; width: 132px; text-align: center; }
    .hud-lane b { max-width: none; }
    .hud-lane button { width: 44px; height: 44px; }
    .archive.is-open .hud-count { opacity: 0; visibility: hidden; }
    /* lighter at the very top and bottom, where the browser's bars lie over the field, so it shows through them */
    .stage3d::before { background: linear-gradient(color-mix(in srgb, var(--paper) 55%, transparent), color-mix(in srgb, var(--paper) 0%, transparent) 16%,
                                    color-mix(in srgb, var(--paper) 0%, transparent) 50%, color-mix(in srgb, var(--paper) 85%, transparent) 76%,
                                    color-mix(in srgb, var(--paper) 85%, transparent) 88%, color-mix(in srgb, var(--paper) 40%, transparent)); }
    .stage3d::after { background: linear-gradient(to top, color-mix(in srgb, var(--paper) 96%, transparent) 50%, color-mix(in srgb, var(--paper) 0%, transparent) 64%); }
    .sheet { left: var(--edge-l); right: var(--edge-r); top: calc(var(--runway, 0px) + 100dvh * .46); bottom: 0; /* of what's between the bars */ width: auto; max-height: none; padding: 0 0 calc(var(--edge-b) + 8px);
             transform: translateY(12px); }
    .sheet.show { transform: none; }
    .rows { gap: 14px 18px; }
  }
  /* phones on their side and other short screens: a slimmer HUD */
  @media (min-width: 761px) and (max-height: 560px) {
    :root { --edge: 18px; }
    .brand { font-size: 1.3rem; }
    .hud-keys, .hud-foot, .hud-scale { display: none; }
    .hud-back { top: calc(var(--edge-t) + 44px); }
    .hud-sel { top: 30%; }
    .hud-count, .hud-lane { bottom: var(--edge-b); }
    .hud-count .num { font-size: 2.2rem; }
    .sheet { max-height: calc(100% - var(--edge-t) - var(--edge-b)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0s !important; transition-delay: 0s !important; }
  }

<body>
<div class="app">
  <main class="archive" id="archive">
    <div class="stage3d" id="stage3d"></div>

    <header class="hud hud-brand"><h1 class="brand">Lab Inventory<small>Equipment <b>Archive</b></small></h1></header>
    <nav class="hud hud-tools" aria-label="Tools">
      <button type="button" data-scan aria-label="Scan a label"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4M4 8h8"/></svg>Scan</button>
      <button type="button" data-panel="search" aria-label="Search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9.5" cy="6.5" r="4.5"/><path d="M6.3 9.7 1.5 14.5"/></svg><span class="tool-label">Search</span> <kbd>/</kbd></button>
      <button type="button" data-panel="mine">+ Mine <b id="mineBadge">00</b></button>
    </nav>
    <button class="hud hud-back opened" type="button" data-do="close"><span aria-hidden="true">←</span>Archive overview <kbd>Esc</kbd></button>

    <section class="hud hud-sel browse" aria-live="polite">
      <p class="cap crumb"><span>Inventory</span><span>/</span><span id="selGroup"></span></p>
      <h2>Item: <span id="selId"></span></h2>
      <div class="hud-rule"></div>
      <div class="sel-body">
        <span class="desc" id="selDesc"></span><span class="cap">Home</span>
        <span class="status status-dot" id="selStatus"></span><span id="selHome"></span>
      </div>
      <button class="hud-open" type="button" data-open>Open item <span aria-hidden="true">→</span></button>
    </section>

    <div class="hud hud-count">
      <p class="cap" id="countCap">Archive / Select</p>
      <p class="num"><b id="selIdx">01</b><span>/ <i id="selOf">01</i></span></p>

      <button type="button" data-move="0,1" aria-label="Next item">↑</button>

      <div><p class="cap" id="laneNo">Group</p><b id="laneName"></b></div>
      <button type="button" data-move="1,0" aria-label="Next group">→</button>
    </div>
    <p class="hud hud-keys browse"><span>← → Group</span><span>/</span><span>↑ ↓ Item</span><span>/</span><span>Enter Open</span></p>

    <div class="topbar">
      <span class="brand">Lab Inventory</span>
      <span class="topbar-tools"><button class="btn" type="button" data-scan>Scan</button><button class="btn" type="button" data-panel="search" id="menuBtn" aria-controls="panel" aria-expanded="false">Search</button></span>
    </div>
    <div class="list" id="list"><p><span class="spinner"></span>Loading…</p></div>

  </main>

  <aside class="panel" id="panel" aria-label="Search and your items">
    <div class="panel-head"><h2>Archive index</h2><button class="x" type="button" id="panelClose" aria-label="Close">×</button></div>
    <p class="who" id="who">Signing in…</p>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Search ID, name, brand, location" autocomplete="off" aria-label="Search items">
    </form>

      <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-filter="available" aria-pressed="false">Available</button>
      <button class="chip" type="button" data-filter="out" aria-pressed="false">Checked out</button>
      <button class="chip" type="button" data-filter="mine" aria-pressed="false">Mine</button>
    </div>
    <label class="toggle"><input type="checkbox" id="showInactive"> Show retired and missing items</label>
    <p class="result-count" id="resultCount"></p>
    <ul class="matches" id="matches" hidden></ul>
    <h2 class="panel-title" id="mineTitle">Checked out to me <span id="mineCount"></span></h2>
    <ul class="mine" id="mine" aria-live="polite"><li><span class="spinner"></span>Loading…</li></ul>
  </aside>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<?!= include('Archive3D'); ?>
<?!= include('Scanner'); ?>
<script>
  const START_ID = <?!= JSON.stringify(itemId) ?>;
  const STATUS_OUT = 'Checked Out';
  const DONE = { checkOut: 'is checked out to you.', returnItem: 'is returned.', setCondition: 'condition is saved.' };
  const BUSY = { checkOut: 'Checking out…', returnItem: 'Returning…' };

  const state = {
    user: '', items: [], byId: {}, conditions: ['working', 'not working', 'unknown'],
    filter: 'all', q: '', showInactive: false,
    openId: null, history: [],          // the open item, and its recent log entries
    arrived: false, loaded: false,      // in 3D its sheet waits for the camera to arrive, and its parts for the details to load
    busy: {},                           // ItemID -> { fn, arg } of the server call changing it right now
    focus: null,                        // what the 3D field has selected, for the HUD (see Archive3D's info)
    photos: {},                         // ItemID -> its photo as a data: URL, or null for none; loaded when it is opened
  };
  let archive3d = null, groupsKey = '', toastTimer, searchTimer;
  const flat = () => !archive3d; // the plain list rather than the 3D field
  const pad = (n) => String(n).padStart(2, '0');

  // ---- small helpers ----------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';');
  const upper = (s) => String(s).toUpperCase();
  const isMine = (it) => it.Status === STATUS_OUT && String(it.Holder).trim().toLowerCase() === state.user.toLowerCase();
  const isActive = (it) => it.Active === true || upper(it.Active) === 'TRUE';
  const shortName = (email) => String(email || '').split('@')[0];

  /** Call a server function; resolves with its result, or shows the error and rejects. */
  function server(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler((err) => {
        toast(err && err.message ? err.message : String(err), true);
        reject(err);
      })[fn](...args);
    });
  }

  function toast(text, isError) {
    const t = $('toast');
    t.textContent = text;
    t.className = 'toast' + (isError ? ' error' : '');
    void t.offsetWidth;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 6000 : 3200);
  }

  /** Status as a key (for colours) and a short label. */
  function status(it) {
    if (!isActive(it)) return { key: 'inactive', text: 'Inactive' };
    if (it.Status !== STATUS_OUT) return { key: 'available', text: 'Available' };
    return isMine(it) ? { key: 'mine', text: 'With you' } : { key: 'out', text: 'Out · ' + shortName(it.Holder) };
  }

  // ---- grouping and filters ------------------------------------------------------

  /** Groups by ID prefix (3DP, AC, MD…); office items make one group, one-offs share "Other equipment". */
  function groupItems(items) {
    const byKey = {}, groups = [], other = [];
    items.forEach((it) => {
      const key = it.Category === 'Office' ? 'Office' : String(it.ItemID).replace(/\d+$/, '') || it.ItemID;
      (byKey[key] = byKey[key] || []).push(it);
    });
    Object.keys(byKey).sort().forEach((key) => {
      const list = byKey[key];
      if (key === 'Office') groups.push({ code: 'OFC', name: 'Office equipment', items: list });
      else if (list.length < 2) other.push(...list);
      else groups.push({ code: key, name: commonName(list), items: list });
    });
    if (other.length) groups.push({ code: '+', name: 'Other equipment', items: other });
    return groups;
  }

  /** The description most items in a group share, in its original spelling. */
  function commonName(list) {
    const counts = {}, spelling = {};
    list.forEach((it) => {
      const d = String(it.Description || '').trim(), k = d.toLowerCase();
      if (!d) return;
      counts[k] = (counts[k] || 0) + 1;
      if (!spelling[k] || /^[A-Z]/.test(d)) spelling[k] = d;
    });
    const name = spelling[Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0]] || '';
    return /^[a-z]+\b/.test(name) && !/^[a-z]+[A-Z]/.test(name) ? name.charAt(0).toUpperCase() + name.slice(1) : name;
  }

  function matches(it) {
    if (!state.showInactive && !isActive(it)) return false;
    if (state.filter === 'available' && !(isActive(it) && it.Status !== STATUS_OUT)) return false;
    if (state.filter === 'out' && it.Status !== STATUS_OUT) return false;
    if (state.filter === 'mine' && !isMine(it)) return false;
    const hay = [it.ItemID, it.Description, it.Brand, it.Model, it['Home Location'], it.Holder].join(' ').toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
  }
  const shown = (it) => it.ItemID === state.openId || matches(it); // the open item stays whatever the filters say

  // ---- the archive ---------------------------------------------------------------------

  /** Re-draw something without losing a note the user is in the middle of typing on the sheet. */
  function keepingNote(draw) {
    const old = $('sheet').querySelector('textarea'), typing = old && document.activeElement === old;
    draw();
    const note = $('sheet').querySelector('textarea');
    if (old && note) { note.value = old.value; if (typing) note.focus(); }
  }

  function renderArchive() {
    const hits = state.q ? state.items.filter(matches).slice(0, 12) : []; // search hits in the side panel; picking one opens it
    $('resultCount').textContent = `${state.items.filter(matches).length} of ${state.items.length} items`;
    $('footCount').textContent = $('resultCount').textContent;
    $('matches').hidden = !hits.length;
    $('matches').innerHTML = hits.map((it) =>
      `<li><button type="button" data-id="${esc(it.ItemID)}"><b>${esc(it.ItemID)}</b><span>${esc(it.Description)}</span></button></li>`).join('');

    // The plain list: what the filters leave, by group.
    keepingNote(() => {
      $('archive').appendChild($('sheet')); // out of the list while it is rebuilt
      $('list').innerHTML = groupItems(state.items.filter(shown)).map((group) => `
        <h2 class="lane-head"><b>${esc(group.code)}</b>${esc(group.name)}<span>${group.items.length}</span></h2>
        ${group.items.map((it) => `<article class="item${it.ItemID === state.openId ? ' open' : ''}${isActive(it) ? '' : ' inactive'}"
          data-id="${esc(it.ItemID)}" tabindex="0">${headHtml(it)}</article>`).join('')}`).join('') || '<p>No items match these filters.</p>';
      placeSheet();
    });

    // The 3D field: every item keeps its block, and the ones the filters leave out sink into the floor.
    if (!archive3d) return;
    const groups = groupItems(state.items.filter((it) => state.showInactive || isActive(it) || it.ItemID === state.openId));
    const key = groups.map((g) => g.code + ':' + g.items.map((i) => i.ItemID).join(',')).join('|');
    if (key !== groupsKey) {
      groupsKey = key;
      archive3d.setLanes(groups);
      if (state.openId && !flat()) archive3d.show(state.openId);
    }
    archive3d.setFilter(shown);
  }

  /** The sheet lies over the 3D view; in the plain list it goes where the open item's row was. */
  function placeSheet() {
    const row = flat() && document.querySelector('#list .item.open');
    if (row) row.after($('sheet')); else $('archive').appendChild($('sheet'));
  }

  /** Which of the two the archive is right now. Switching puts an open item back. */
  function setMode() {
    if (document.body.classList.contains('flat') !== flat()) closeCard();
    document.body.classList.toggle('flat', flat());
  }

  function headHtml(it) {
    const st = status(it);
    return `<header class="head">
        <p class="cap file"><span>File ${esc(it.ItemID)}</span><span>${esc(it.Category || '')}</span></p>
        <h3>${esc(it.Description || 'No description')}</h3>
        <p class="sub"><b>${esc(it.ItemID)}</b><span class="status status-dot st-${st.key}">${esc(st.text)}</span></p>
      </header>`;
  }

  /** The open item's sheet: its heading; its details, recent activity and a note to go with the action; and the action. */
  function sheetHtml(it) {
    const out = it.Status === STATUS_OUT, busy = state.busy[it.ItemID], off = busy ? ' disabled' : '';
    const condition = String((busy && busy.fn === 'setCondition' ? busy.arg : it.Condition) || 'unknown').toLowerCase();
    const fact = (label, value, wide) => value === '' || value == null ? '' :
      `<div${wide ? ' class="wide"' : ''}><p class="cap">${label}</p><div class="val">${esc(value)}</div></div>`;
    const action = out ? { fn: 'returnItem', label: isMine(it) || !it.Holder ? 'Return' : 'Return for ' + shortName(it.Holder) }
                       : { fn: 'checkOut', label: 'Check out to me' };
    return `
      <button class="close" type="button" data-do="close" aria-label="Close">×</button>
      ${headHtml(it)}
      <p class="loader"><i></i><i></i><i></i>Loading</p>
      <div class="rule${out ? ' active' : ''}"></div>
      <div class="sheet-body">
      <div class="col">
        ${state.photos[it.ItemID] ? `<img class="photo" src="${esc(state.photos[it.ItemID])}" alt="${esc(it.ItemID)} photo">` : ''}
        <div class="rows">
          ${fact('Home', it['Home Location'])}
          <div><p class="cap">Condition</p><select aria-label="Condition"${off}>${[...new Set([...state.conditions, condition])].map((c) =>
            `<option${c === condition ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
          ${fact('Brand', it.Brand)}${fact('Model', it.Model)}${fact('S/N', it['S/N'])}${fact('Holder', shortName(it.Holder))}
          ${fact('Updated', it['Last Updated'])}${fact('Accessories', it.Accessories, true)}
        </div>
      </div>
      ${state.history.length ? `
        <div class="col">
          <p class="cap history-title">Recent activity</p>
          <ol class="history">${state.history.map((h) =>
            `<li><span>${esc(h.action + ' · ' + shortName(h.user) + (h.note ? ' — ' + h.note : ''))}</span><span class="cap">${esc(h.when)}</span></li>`).join('')}</ol>
        </div>` : ''}
      ${isActive(it) ? `<div class="col"><textarea rows="3" placeholder="Note (optional): where it's going, which project"${off}></textarea></div>` : ''}
      </div>
      <div class="col sheet-actions">
        ${isActive(it) ? `
          <button class="btn act${out ? '' : ' fill'}" type="button" data-do="${action.fn}"${off}>${
            busy && BUSY[busy.fn] ? `<span class="spinner"></span>${BUSY[busy.fn]}` : esc(action.label)}</button>` : `
          <p class="notice">This item is marked retired or missing, so it can’t be checked out. If you’ve found it, tell the lab manager.</p>`}
      </div>`;
  }

  /** Re-write the sheet, if this is the item on it. */
  function paint(it) {
    if (it.ItemID === state.openId) keepingNote(() => { $('sheet').innerHTML = sheetHtml(it); });
  }

  /**
   * Bring the sheet in, in step with the camera and the server. It appears once the camera is in front
   * of the block (at once, in the plain list), showing a loader; when the item's details are in as
   * well, the loader gives way and the sheet's parts pop in one after another.
   */
  function reveal() {
    const sheet = $('sheet');
    if (!state.openId || !(flat() || state.arrived)) return;
    sheet.classList.add('show');
    if (!state.loaded || !sheet.classList.contains('loading')) return;
    sheet.classList.remove('loading');
    sheet.classList.add('pop');
    sheet.querySelectorAll('.rule, .rows > *, .col > :not(.rows)').forEach((el, i) => el.style.setProperty('--i', i));
    setTimeout(() => sheet.classList.remove('pop'), 1400); // so later re-draws don't pop again
  }

  function openCard(id) {
    const it = state.byId[upper(id)], sheet = $('sheet');
    if (!it) { toast(`No item with ID "${id}".`, true); return; }
    if (state.openId === it.ItemID) return;
    Object.assign(state, { openId: it.ItemID, history: [], arrived: false, loaded: false });
    showPanel(false);
    sheet.hidden = false;
    sheet.className = 'sheet loading';
    sheet.innerHTML = sheetHtml(it);
    $('archive').classList.add('is-open');
    renderArchive();
    if (flat()) sheet.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    else archive3d.show(it.ItemID); // it rises and the camera goes to it; onArrive follows
    reveal();
    try { google.script.history.replace(null, { item: it.ItemID }); } catch (e) {}
    server('getItem', it.ItemID).then((res) => updateItem(res.item, res.history), () => {}).then(() => {
      if (state.openId === it.ItemID) { state.loaded = true; reveal(); }
    });
    loadPhoto(it.ItemID).then((url) => {
      if (archive3d) archive3d.setPhoto(it.ItemID, url);
      if (url) paint(it);
    });
  }

  /** The item's photo (see getPhoto), once per item. No photo, or no photo folder set up, is not an error. */
  function loadPhoto(id) {
    if (id in state.photos) return Promise.resolve(state.photos[id]);
    return new Promise((resolve) => google.script.run
      .withSuccessHandler((res) => resolve(state.photos[id] = (res && res.url) || null))
      .withFailureHandler(() => resolve(null))
      .getPhoto(id));
  }

  function closeCard() {
    if (!state.openId) return;
    state.openId = null;
    $('sheet').classList.remove('show');
    $('sheet').hidden = true;
    $('archive').classList.remove('is-open');
    if (archive3d) archive3d.hide(); // the camera goes back out over the field and the block drops
    renderArchive();
    try { google.script.history.replace(null, {}); } catch (e) {}
  }

  /** Check out, return or re-grade an item, then show what the spreadsheet says it is now. */
  async function change(fn, id, arg) {
    const it = state.byId[upper(id)];
    if (state.busy[id]) return;
    state.busy[id] = { fn, arg };
    paint(it);
    renderMine();
    const res = await server(fn, id, arg).catch(() => null);
    delete state.busy[id];
    if (res) {
      const note = id === state.openId && $('sheet').querySelector('textarea');
      if (note && fn !== 'setCondition') note.value = '';
      updateItem(res.item, res.history);
      toast(`${id} ${DONE[fn]}`);
    } else {
      paint(it);
      renderMine();
    }
  }

  /** Merge a fresh copy of one item from the server and refresh everything that shows it. */
  function updateItem(fresh, history) {
    const k = upper(fresh.ItemID);
    if (!state.byId[k]) state.items.push(state.byId[k] = {});
    const was = JSON.stringify(status(state.byId[k])), it = Object.assign(state.byId[k], fresh);
    if (state.openId === it.ItemID && history) state.history = history;
    paint(it);
    if (archive3d) archive3d.updateItem(it, JSON.stringify(status(it)) !== was); // its card hops if its status changed
    renderHud();
    renderMine();
    renderArchive();
  }

  // ---- side panel ------------------------------------------------------------------------

  /** "Checked out to me": one flat card per item; click it to open the item, or return it right here. */
  function renderMine() {
    const mine = state.items.filter(isMine);
    $('mineCount').textContent = mine.length || '';
    $('mineBadge').textContent = pad(mine.length);
    $('mine').innerHTML = mine.map((it) => `
      <li data-id="${esc(it.ItemID)}">
        <button class="open" type="button"><b>${esc(it.ItemID)}</b><span>${esc(it.Description)}</span>
          <small>${esc([it['Home Location'], it['Last Updated'] && 'since ' + it['Last Updated']].filter(Boolean).join(' · '))}</small></button>
        <button class="btn" type="button" data-do="returnItem"${state.busy[it.ItemID] ? ' disabled' : ''}>Return</button>
      </li>`).join('') || '<li>Nothing checked out. Pick an item, or scan its label, to check it out.</li>';
  }

  function setFilter(f) {
    state.filter = f;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.filter === f)));
    renderArchive();
  }

  /** The search drawer; `at` is what to show first: the search box, or the items checked out to you. */
  function showPanel(open, at) {
    $('panel').classList.toggle('open', open);
    $('scrim').classList.toggle('show', open);
    $('menuBtn').setAttribute('aria-expanded', String(open));
    if (!open) return;
    if (at === 'mine') $('mineTitle').scrollIntoView({ block: 'start' });
    else { $('panel').scrollTop = 0; $('q').focus({ preventScroll: true }); }
  }

  /** Open the label scanner (Scanner.html); the item it finds opens. */
  function startScan() {
    if (!state.items.length) { toast('The inventory is still loading.'); return; }
    showPanel(false);
    Scanner.open({ ids: state.items.map((it) => it.ItemID), onFound: openCard });
  }

  // ---- HUD ------------------------------------------------------------------------------

  /** The selected item's block, its place in its group (with a scale to step through it), and the group. */
  function renderHud() {
    const f = state.focus;
    if (!f) return;
    const it = f.item, st = status(it);
    $('selGroup').textContent = f.group.name;
    $('selId').textContent = it.ItemID;
    $('selDesc').textContent = it.Description || 'No description';
    $('selStatus').textContent = st.text;
    $('selStatus').className = 'status status-dot st-' + st.key;
    $('selHome').textContent = it['Home Location'] || '—';
    $('selIdx').textContent = pad(f.index);
    $('selOf').textContent = pad(f.count);
    $('countCap').textContent = f.group.code === '+' ? 'Other / Select' : f.group.code + ' / Select';
    $('ticks').innerHTML = Array.from({ length: Math.min(f.count, 24) }, (_, i) =>
      `<i${i === Math.min(f.index, 24) - 1 ? ' class="on"' : ''}></i>`).join('');
    $('laneNo').textContent = `Group ${pad(f.groupNo)} / ${pad(f.groups)}`;
    $('laneName').textContent = f.group.name;
  }

  // ---- wiring -------------------------------------------------------------------
  const idAt = (ev) => { const e = ev.target.closest('[data-id]'); return e && e.dataset.id; };
  const doAt = (ev) => { const e = ev.target.closest('[data-do]'); return e && e.dataset.do; };

  // On the sheet a click presses a button; on a row of the plain list it opens that item; elsewhere it closes the
  // sheet. Clicks on the 3D field come through Archive3D's hooks instead (see start3D).
  document.addEventListener('click', (ev) => {
    const within = (sel) => ev.composedPath().find((n) => n.matches && n.matches(sel)); // holds even if a handler re-rendered the target
    const action = doAt(ev), row = within('.item'), hud = within('.hud, .topbar');
    if (within('.sheet')) {
      if (action === 'close') closeCard();
      else if (action) change(action, state.openId, $('sheet').querySelector('textarea').value);
    } else if (row) openCard(row.dataset.id);
    else if (hud) {
      const panel = within('[data-panel]'), move = within('[data-move]');
      if (within('[data-scan]')) startScan();
      else if (panel) showPanel(true, panel.dataset.panel);
      else if (move) archive3d.move(...move.dataset.move.split(',').map(Number));
      else if (within('[data-open]') && state.focus) openCard(state.focus.item.ItemID);
      else if (action === 'close') closeCard();
    } else if (!within('.panel, .scrim, canvas, .scanner')) closeCard();
  });
  $('sheet').onchange = (ev) => { if (ev.target.matches('select')) change('setCondition', state.openId, ev.target.value); };
  document.addEventListener('keydown', (ev) => {
    const step = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[ev.key]; // up: the next item, which stands further back
    if (ev.key === 'Escape') { if ($('panel').classList.contains('open')) showPanel(false); else closeCard(); }
    else if (/INPUT|TEXTAREA|SELECT|BUTTON/.test(ev.target.tagName)) return;
    else if (ev.key === '/') { ev.preventDefault(); showPanel(true); }
    else if (ev.key === 'Enter' && ev.target.matches('.item')) openCard(ev.target.dataset.id);
    else if (flat()) return;
    else if (step) { ev.preventDefault(); archive3d.move(...step); }
    else if (ev.key === 'Enter' && archive3d.current()) { ev.preventDefault(); openCard(archive3d.current().item.ItemID); }
  });

  /** Fade a scroll area's content out at the top and bottom when there is more beyond that edge. */
  function edgeFade(el) {
    const below = el.scrollHeight - el.clientHeight - el.scrollTop;
    el.style.setProperty('--fade-top', el.scrollTop > 2 ? '28px' : '0px');
    el.style.setProperty('--fade-bottom', below > 2 ? '44px' : '0px');
  }
  // On scrolling, and whenever their contents or size change: the search hits, and the sheet's middle part (which
  // is rebuilt with the sheet, so the sheet passes these on).
  [[$('matches'), (el) => el], [$('sheet'), (el) => el.querySelector('.sheet-body')]].forEach(([el, part]) => {
    const fade = () => { const p = part(el); if (p) edgeFade(p); };
    el.addEventListener('scroll', fade, { passive: true, capture: true });
    el.addEventListener('load', fade, true); // a photo coming in
    el.addEventListener('input', fade); // the note growing as it is typed
    new ResizeObserver(fade).observe(el);
    new MutationObserver(fade).observe(el, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] }); // e.g. the details shown once loaded
  });

  $('chips').onclick = (ev) => { if (ev.target.dataset.filter) setFilter(ev.target.dataset.filter); };
  $('matches').onclick = (ev) => { if (idAt(ev)) openCard(idAt(ev)); };
  $('mine').onclick = (ev) => { if (doAt(ev)) change(doAt(ev), idAt(ev), ''); else if (idAt(ev)) openCard(idAt(ev)); };
  $('q').oninput = () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.q = $('q').value.trim(); renderArchive(); }, 120);
  };
  $('searchForm').onsubmit = (ev) => {
    ev.preventDefault();
    state.q = $('q').value.trim();
    renderArchive();
    if (state.byId[upper(state.q)]) openCard(state.q); // an exact ID and Enter opens it
  };
  $('showInactive').onchange = (ev) => { state.showInactive = ev.target.checked; renderArchive(); };
  $('panelClose').onclick = () => showPanel(false);
  $('scrim').onclick = () => showPanel(false);

  // ---- start --------------------------------------------------------------------

  /** The 3D module loads from a CDN after this script; until it has (or if it can't run), the archive is the plain list. */
  function start3D() {
    if (archive3d || !window.Archive3D || !Archive3D.supported) return;
    try {
      archive3d = Archive3D.mount($('stage3d'), {
        status,
        onSelect: closeCard,                                                   // browsing away puts an open card back
        onOpen(it) { if (state.openId || !it) closeCard(); else openCard(it.ItemID); }, // a click on a card, or on nothing
        onArrive() { state.arrived = true; reveal(); },                        // the camera is in front of the open card
        onFocus(info) { state.focus = info; renderHud(); },                    // the selection moved: the HUD follows
      });
    } catch (e) { archive3d = null; }
    const reopen = archive3d && state.openId; // an item opened in the plain list before the 3D view was ready (?item=)
    setMode();
    if (state.items.length) renderArchive();
    if (reopen) openCard(reopen);
  }
  setMode();
  // Start just past the runway at the top of the page (see .archive), so Safari sees it scrolled under its bars, and
  // go back there after anything else moves it: a scroll up into the runway, or Safari lifting the page (and the
  // archive inside it) to show a field above the keyboard, which it leaves where it is when the keyboard goes
  function scrollPastRunway() {
    if (flat()) return;
    const field = document.activeElement;
    if (field && field.matches('input, textarea, select')) return; // the keyboard is up: leave it where Safari put it
    const runway = parseFloat(getComputedStyle(document.body).getPropertyValue('--runway')) || 0;
    if ($('archive').scrollTop) $('archive').scrollTop = 0;
    if (window.scrollY !== runway) window.scrollTo(0, runway);
  }
  document.addEventListener('focusout', () => { setTimeout(scrollPastRunway, 0); setTimeout(scrollPastRunway, 400); }); // and once the keyboard is down
  if (window.visualViewport) window.visualViewport.addEventListener('resize', scrollPastRunway);
  // A drag on the HUD would scroll the page (and Safari's bars with it); only the sheet's own text scrolls
  $('archive').addEventListener('touchmove', (ev) => {
    if (!flat() && !ev.target.closest('.sheet-body')) ev.preventDefault();
  }, { passive: false });
  requestAnimationFrame(scrollPastRunway);
  window.addEventListener('pageshow', scrollPastRunway);
  window.addEventListener('scrollend', scrollPastRunway);
  if (window.Archive3D) start3D(); else window.addEventListener('archive3d-ready', start3D);

  // The list from the last visit is shown at once, from this browser's storage, while the server sends the current one
  const LIST_KEY = 'labInventory.items' + (window.LAB_INVENTORY_DEMO ? '.demo' : '');
  let listShown = false;
  function showList(res) {
    // fresh copies go into the item objects already shown, so an item open from the kept list stays open
    const byId = {}, changed = [];
    const items = res.items.map((fresh) => {
      const k = upper(fresh.ItemID), old = state.byId[k];
      const was = old && JSON.stringify(old), wasStatus = old && JSON.stringify(status(old));
      const it = byId[k] = Object.assign(old || {}, fresh);
      if (old && JSON.stringify(it) !== was) changed.push([it, JSON.stringify(status(it)) !== wasStatus]);
      return it;
    });
    Object.assign(state, { user: res.user, items: items, byId: byId, conditions: res.conditions || state.conditions });
    $('who').textContent = 'Signed in as ' + res.user;
    $('footWho').textContent = 'Signed in · ' + shortName(res.user);
    renderArchive();
    renderMine();
    changed.forEach(([it, hop]) => { paint(it); if (archive3d) archive3d.updateItem(it, hop); });
    if (!listShown && START_ID) openCard(START_ID);
    listShown = true;
  }
  try { const kept = JSON.parse(localStorage.getItem(LIST_KEY)); if (kept && kept.items) showList(kept); } catch (e) {}
  server('getAllItems').then((res) => {
    try { localStorage.setItem(LIST_KEY, JSON.stringify(res)); } catch (e) {}
    showList(res);
  }, () => { if (!listShown) $('who').textContent = 'Could not load the inventory. Reload the page to try again.'; });
</script>
</body>
</html>
